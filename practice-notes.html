<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中級へ行こう — Speaking Test Study</title>
<style>
:root{--bg:#f7f3ec;--text:#2c2416;--accent:#b8433a;--grammar-color:#7b2d8e;--card-bg:#fefcf8;--border:#e0d8cc;--hira:#8a7e6b;--trans:#5a5043}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.ctr{max-width:800px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;color:var(--accent);text-align:center;margin:20px 0 8px;letter-spacing:.05em}
.sub{text-align:center;color:var(--hira);font-size:.9rem;margin-bottom:30px}
.sec{margin-bottom:40px}
.thdr{background:var(--accent);color:#fff;padding:12px 18px;border-radius:8px 8px 0 0;font-size:1.1rem;font-weight:bold}
.tq{background:var(--card-bg);border:1px solid var(--border);border-top:none;padding:10px 18px;font-size:1rem;border-radius:0 0 8px 8px;margin-bottom:16px}
.tqe{font-size:.85rem;color:var(--hira);margin-top:4px}
.sb{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.jp{font-size:1.15rem;line-height:2;margin-bottom:6px}
.tk{cursor:pointer;display:inline}
.tk.wt:active{background:rgba(184,67,58,.1);border-radius:3px}
.tk.gt{color:var(--grammar-color);font-weight:bold}
.tk.gt:active{background:rgba(123,45,142,.1);border-radius:3px}
.pu{cursor:default}
.hl{font-size:.85rem;color:var(--hira);margin-bottom:3px}
.tl{font-size:.85rem;color:var(--trans);font-style:italic}
.dt{display:flex;align-items:center;gap:6px;margin-top:6px}
.dt button{background:none;border:1px solid var(--border);border-radius:4px;padding:2px 10px;font-size:.78rem;color:var(--hira);cursor:pointer}
.dt button.ac{background:var(--border);color:var(--text)}
.hid{display:none}
.po{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:flex-end;padding-bottom:10vh}
.po.vis{display:flex}
.pp{background:var(--card-bg);border-radius:12px;padding:20px 24px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.pw{font-size:1.4rem;font-weight:bold;margin-bottom:6px}
.pw.gm{color:var(--grammar-color)}
.pr{font-size:1rem;color:var(--hira);margin-bottom:4px}
.pm{font-size:.95rem;margin-bottom:4px}
.pe{font-size:.88rem;color:var(--grammar-color);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5}
.ps{font-size:.78rem;color:var(--hira);margin-top:4px}
#pwo{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:999;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:16px}
#pwo h2{color:var(--accent);font-size:1.3rem}
#pwo input{font-size:1.1rem;padding:10px 16px;border:2px solid var(--border);border-radius:8px;background:var(--card-bg);text-align:center;width:240px;outline:none}
#pwo input:focus{border-color:var(--accent)}
#pwo button{background:var(--accent);color:#fff;border:none;padding:10px 32px;border-radius:8px;font-size:1rem;cursor:pointer}
#pwe{color:var(--accent);font-size:.9rem;display:none}
</style>
</head>
<body>
<div id="pwo">
<h2>Speaking Test Study Materials</h2>
<input type="password" id="pwi" placeholder="Password" autocomplete="off">
<button onclick="ck()">Enter</button>
<div id="pwe">Incorrect password</div>
</div>
<div id="ct" class="hid">
<div class="ctr">
<h1>中級へ行こう</h1>
<div class="sub">Speaking Test Speeches (2 min each)</div>
<div id="sp"></div>
</div>
</div>
<div class="po" id="pov" onclick="cp()">
<div class="pp" onclick="event.stopPropagation()">
<div class="pw" id="ppw"></div>
<div class="pr" id="ppr"></div>
<div class="pm" id="ppm"></div>
<div class="pe hid" id="ppe"></div>
</div>
</div>
