meaning": "だけ means 'only'. It is added after quantifiers or nouns to indicate that there is no more or nothing else.", "connection": "Quantifier / N ＋ だけ", "examples": ["パワー電気に 外国人の 社員が 1人だけ います。", "休みは 日曜日だけです。"], "popup_priority": "low"}, {"id": "m1_L12_1", "source": "minna1", "lesson": "Lesson 12", "rule": "1. Tense and affirmative/negative forms of noun sentences and な-adjective sentences", "meaning": "Noun and な-adjective sentences inflect to show past/non-past and affirmative/negative states.", "connection": "N / な-adj (drop な) ＋ です / でした / じゃありません / じゃありませんでした", "examples": ["きのうは 雨でした。", "きのうの 試験は 簡単じゃ ありませんでした。"], "popup_priority": "low"}, {"id": "m1_L12_2", "source": "minna1", "lesson": "Lesson 12", "rule": "2. Tense and affirmative/negative forms of い-adjective sentences", "meaning": "い-adjective sentences inflect to show past/non-past and affirmative/negative states.", "connection": "い-adj (keep い) ＋ です / (drop い) ＋ くないです / かったです / くなかったです", "examples": ["きのうは 暑かったです。", "きのうの パーティーは あまり 楽しくなかったです。"], "popup_priority": "low"}, {"id": "m1_L12_3", "source": "minna1", "lesson": "Lesson 12", "rule": "3. N1は N2より adjです", "meaning": "This sentence pattern describes the quality and/or state of N1 in comparison with N2.", "connection": "N1は N2より adjです", "examples": ["この 車は あの 車より 大きいです。"], "popup_priority": "low"}, {"id": "m1_L12_4", "source": "minna1", "lesson": "Lesson 12", "rule": "4. N1と N2と どちらが adjですか ……N1／ N2の ほうが adjです", "meaning": "The interrogative どちら is used when comparing any two items. The reply indicates the preferred or applicable option.", "connection": "N1と N2と どちらが adjですか / N1/N2の ほうが adjです", "examples": ["サッカーと 野球と どちらが おもしろいですか。……サッカーの ほうが おもしろいです。", "ミラーさんと サントスさんと どちらが テニスが 上手ですか。", "北海道と 大阪と どちらが 涼しいですか。", "春と 秋と どちらが 好きですか。"], "popup_priority": "low"}, {"id": "m1_L12_5", "source": "minna1", "lesson": "Lesson 12", "rule": "5. N1［の中］で 何／どこ／だれ／いつ が いちばん adjですか ……N2 が いちばん adjです", "meaning": "This question pattern asks the listener to choose, from a group or category (N1), the item (N2) that exhibits the highest degree of the adjective's quality.", "connection": "N1［の中］で Interrogative が いちばん adjですか / N2 が いちばん adjです", "examples": ["日本料理［の中］で 何が いちばん おいしいですか。……てんぷらが いちばん おいしいです。", "ヨーロッパで どこが いちばん よかったですか。……スイスが いちばん よかったです。", "家族で だれが いちばん 背が 高いですか。……弟が いちばん 背が 高いです。", "1年で いつが いちばん 寒いですか。……2月が いちばん 寒いです。"], "popup_priority": "low"}, {"id": "m1_L12_6", "source": "minna1", "lesson": "Lesson 12", "rule": "6. Adjの （の substituting for a noun）", "meaning": "の can substitute for a noun previously mentioned to avoid repetition, used with adjectives.", "connection": "Adj ＋ の", "examples": ["カリナさんの かばんは どれですか。……あの 赤くて、大きいのです。"], "popup_priority": "low"}, {"id": "m1_L13_1", "source": "minna1", "lesson": "Lesson 13", "rule": "1. Nが 欲しいです", "meaning": "欲しい is an い-adjective used to express the speaker's or listener's desire for an object. Its object is marked by が.", "connection": "N が 欲しいです", "examples": ["わたしは 友達が 欲しいです。", "今 何が いちばん 欲しいですか。……車が 欲しいです。", "子どもが 欲しいですか。……いいえ、欲しくないです。"], "popup_priority": "low"}, {"id": "m1_L13_2", "source": "minna1", "lesson": "Lesson 13", "rule": "2. Vます-formたいです", "meaning": "Used to express the speaker's or listener's desire to do an action. It inflects in the same way as an い-adjective. The object can be marked with を or が.", "connection": "Vます-form (drop ます) ＋ たいです", "examples": ["わたしは 沖縄へ 行きたいです。", "わたしは てんぷらを 食べたいです。", "神戸で 何を 買いたいですか。……靴を 買いたいです。", "おなかが 痛いですから、何も 食べたくないです。"], "popup_priority": "low"}, {"id": "m1_L13_3", "source": "minna1", "lesson": "Lesson 13", "rule": "3. N（place）へ　Vます-form / Action N に 行きます／来ます／帰ります", "meaning": "The particle に indicates the purpose of movement. The action is expressed as the ます-form of a verb or an action-denoting noun.", "connection": "N(place) へ Vます-form (drop ます) / Action N ＋ に ＋ 行きます／来ます／帰ります", "examples": ["神戸へ インド料理を 食べに 行きます。", "神戸へ 買い物に 行きます。", "日本へ 美術の 勉強に 来ました。", "あした 京都の お祭りに 行きます。"], "popup_priority": "low"}, {"id": "m1_L13_4", "source": "minna1", "lesson": "Lesson 13", "rule": "4. どこか／何か", "meaning": "どこか means 'anywhere' or 'somewhere', and 何か means 'anything' or 'something'. The following particles (へ or を) can be omitted.", "connection": "どこか［へ］ / 何か［を］", "examples": ["冬休みは どこか［へ］ 行きましたか。……はい。北海道へ スキーに 行きました。", "のどが かわきましたから、何か［を］ 飲みたいです。"], "popup_priority": "low"}, {"id": "m1_L13_5", "source": "minna1", "lesson": "Lesson 13", "rule": "5. ご～", "meaning": "The prefix ご is added to words to show respect.", "connection": "ご ＋ N", "examples": ["ご注文は？"], "popup_priority": "low"}, {"id": "m1_L14_1", "source": "minna1", "lesson": "Lesson 14", "rule": "1. Verb Groups and Vて-form", "meaning": "Verbs are classified into three groups (Group I, II, III). The て-form conjugation depends on the verb group (e.g., Group I verbs ending in い/ち/り become って, etc.).", "connection": "Conjugated to Vて-form", "examples": ["かきます → かいて", "のみます → のんで", "たべます → たべて", "します → して"], "popup_priority": "low"}, {"id": "m1_L14_2", "source": "minna1", "lesson": "Lesson 14", "rule": "2. Vて-form ください", "meaning": "Used to politely tell, request, or invite the listener to do something. Often preceded by すみませんが for politeness in requests.", "connection": "Vて-form ＋ ください", "examples": ["すみませんが、この 漢字の 読み方を 教えて ください。", "ボールペンで 名前を 書いて ください。", "どうぞ たくさん 食べて ください。"], "popup_priority": "low"}, {"id": "m1_L14_3", "source": "minna1", "lesson": "Lesson 14", "rule": "3. Vて-form います", "meaning": "Indicates that a certain action or motion is currently in progress.", "connection": "Vて-form ＋ います", "examples": ["ミラーさんは 今 電話を かけて います。", "今 雨が 降って いますか。……はい、降って います。 / ……いいえ、降って いません。"], "popup_priority": "low"}, {"id": "m1_L14_4", "source": "minna1", "lesson": "Lesson 14", "rule": "4. Vます-formましょうか", "meaning": "Used when the speaker is offering to do something for the listener ('Shall I...?').", "connection": "Vます-form (drop ます) ＋ ましょうか", "examples": ["あしたも 来ましょうか。……ええ、10時に 来て ください。", "傘を 貸しましょうか。……すみません。お願いします。", "荷物を 持ちましょうか。……いいえ、けっこうです。"], "popup_priority": "low"}, {"id": "m1_L14_5", "source": "minna1", "lesson": "Lesson 14", "rule": "5. N が V", "meaning": "When describing a phenomenon perceived by the five senses or reporting an event objectively, the subject is marked with the particle が.", "connection": "N が V", "examples": ["雨が 降って います。", "ミラーさんが いませんね。"], "popup_priority": "low"}, {"id": "m1_L14_6", "source": "minna1", "lesson": "Lesson 14", "rule": "6. すみませんが", "meaning": "Used as a casual preamble to a remark to get someone's attention or make a request, rather than as an antithetical conjunction.", "connection": "すみませんが、～", "examples": ["すみませんが、塩を 取って ください。", "失礼ですが、お名前は？"], "popup_priority": "low"}, {"id": "m1_L15_1", "source": "minna1", "lesson": "Lesson 15", "rule": "1. Vて-formも いいですか", "meaning": "Used for asking permission to do something ('May I...?').", "connection": "Vて-form ＋ も いいですか", "examples": ["写真を 撮っても いいですか。", "ここで たばこを 吸っても いいですか。……ええ、［吸っても］ いいですよ。", "……すみません、ちょっと……。のどが 痛いですから。", "……いいえ、［吸っては］いけません。禁煙ですから。"], "popup_priority": "low"}, {"id": "m1_L15_2", "source": "minna1", "lesson": "Lesson 15", "rule": "2. Vて-formは いけません", "meaning": "Used to express prohibition ('You must not...'). Should not be used by someone of lower status to someone of higher status.", "connection": "Vて-form ＋ は いけません", "examples": ["ここで たばこを 吸っては いけません。禁煙ですから。"], "popup_priority": "low"}, {"id": "m1_L15_3", "source": "minna1", "lesson": "Lesson 15", "rule": "3. Vて-form います (States and Habits)", "meaning": "Indicates a state (like knowing or being married), a habitual action repeated over a long period, an occupation, or a personal status.", "connection": "Vて-form ＋ います", "examples": ["わたしは 結婚して います。", "わたしは 田中さんを 知って います。", "わたしは カメラを 持って います。", "わたしは 大阪に 住んで います。", "市役所の 電話番号を 知って いますか。……はい、知って います。 / ……いいえ、知りません。", "IMC は コンピューターソフトを 作って います。", "スーパーで ナンプラーを 売って います。", "ミラーさんは IMC で 働いて います。", "妹は 大学で 勉強して います。"], "popup_priority": "low"}, {"id": "m1_L15_4", "source": "minna1", "lesson": "Lesson 15", "rule": "4. N に V", "meaning": "The particle に is used with verbs such as 入ります, 座ります, 乗ります to indicate the location of the subject resulting from the action.", "connection": "N に V", "examples": ["ここに 入っては いけません。", "ここに 座っても いいですか。", "京都駅から 16番の バスに 乗って ください。"], "popup_priority": "low"}, {"id": "m1_L15_5", "source": "minna1", "lesson": "Lesson 15", "rule": "5. N1に N2を V", "meaning": "The particle に indicates the location (N1) of an object (N2) as the result of an action.", "connection": "N1 に N2 を V", "examples": ["ここに 車を 止めて ください。", "ここに 住所を 書いて ください。"], "popup_priority": "low"}, {"id": "m1_L16_1", "source": "minna1", "lesson": "Lesson 16", "rule": "1. How to join two or more sentences together", "meaning": "Two or more sentences can be joined together using ～て（で）. For verbs: V1 て-form、［V2 て-form、］V3. For adjectives and nouns: い-adj (drop い) ＋ くて, な-adj ＋ で, N ＋ で.", "connection": "Vて-form / い-adj (～くて) / な-adj (～で) / N (～で)", "examples": ["朝 ジョギングを して、シャワーを 浴びて、会社へ 行きます。", "神戸へ 行って、映画を 見て、お茶を 飲みました。", "ミラーさんは 若くて、元気です。", "きのうは 天気が よくて、暑かったです。", "ミラーさんは ハンサムで、親切です。", "奈良は 静かで、きれいな 町です。", "カリナさんは インドネシア人で、富士大学の 留学生です。"], "popup_priority": "low"}, {"id": "m1_L16_2", "source": "minna1", "lesson": "Lesson 16", "rule": "2. V1て-formから、V2", "meaning": "This sentence pattern shows that V2 occurs after V1. Because of this, V1 is often a precondition of doing V2 or an action preparatory to doing it.", "connection": "V1て-form ＋ から、V2", "examples": ["お金を 入れてから、ボタンを 押して ください。", "もう 昼ごはんを 食べましたか。……この 仕事が 終わってから、食べます。"], "popup_priority": "low"}, {"id": "m1_L16_3", "source": "minna1", "lesson": "Lesson 16", "rule": "3. N1は N2が adj", "meaning": "This sentence pattern indicates that the topic (N1) has the characteristic 'N2 が adj'.", "connection": "N1は ＋ N2が ＋ adj", "examples": ["大阪は 食べ物が おいしいです。", "ドイツの フランケンは ワインが 有名です。", "マリアさんは 髪が 長いです。"], "popup_priority": "low"}, {"id": "m1_L16_4", "source": "minna1", "lesson": "Lesson 16", "rule": "4. Nを motionV", "meaning": "を is used with motion verbs (like でます, おります, さんぽします, わたります, あるきます) to indicate a starting point or the place that people or things pass through.", "connection": "N(place) を ＋ motionV", "examples": ["7時に うちを 出ます。", "梅田で 電車を 降りました。", "公園を 散歩します。", "道を 渡ります。"], "popup_priority": "low"}, {"id": "m1_L16_5", "source": "minna1", "lesson": "Lesson 16", "rule": "5. どうやって", "meaning": "どうやって is used when asking the way or how to do something.", "connection": "どうやって ＋ V", "examples": ["大学まで どうやって 行きますか。……京都駅から 16番の バスに 乗って、大学前で 降ります。"], "popup_priority": "low"}, {"id": "m1_L16_6", "source": "minna1", "lesson": "Lesson 16", "rule": "6. どれ／どの N", "meaning": "どれ is an interrogative used when asking someone to specify one item out of a list of three or more. どれ cannot modify a noun directly. When modifying a noun, どの is used.", "connection": "どれ / どの ＋ N", "examples": ["ミラーさんの 傘は どれですか。……あの 青い 傘です。", "サントスさんは どの 人ですか。……あの 背が 高くて、髪が 黒い 人です。"], "popup_priority": "low"}, {"id": "m1_L17_1", "source": "minna1", "lesson": "Lesson 17", "rule": "1. Vない-form", "meaning": "The form of a verb that attaches to ない is called its ない-form. Group I: change final い-column sound to あ-column. Group II: same as ます-form. Group III: し-ない, こ-ない.", "connection": "Conjugated to Vない-form", "examples": ["かき-ます → かか-ない", "たべ-ます → たべ-ない", "き-ます → こ-ない"], "popup_priority": "low"}, {"id": "m1_L17_2", "source": "minna1", "lesson": "Lesson 17", "rule": "2. Vない-formないで ください", "meaning": "Please don't do... This sentence pattern is used to ask or tell someone not to do something, or to show consideration by telling them they don't have to do something.", "connection": "Vない-form ＋ ないで ください", "examples": ["ここで 写真を 撮らないで ください。", "わたしは 元気ですから、心配しないで ください。"], "popup_priority": "low"}, {"id": "m1_L17_3", "source": "minna1", "lesson": "Lesson 17", "rule": "3. Vない-formなければ なりません", "meaning": "Must do... This sentence pattern is used to say that something must be done.", "connection": "Vない-form ＋ なければ なりません", "examples": ["薬を 飲まなければ なりません。"], "popup_priority": "low"}, {"id": "m1_L17_4", "source": "minna1", "lesson": "Lesson 17", "rule": "4. Vない-formなくても いいです", "meaning": "Need not do... This sentence pattern is used when saying that it is not necessary to do something.", "connection": "Vない-form ＋ なくても いいです", "examples": ["あした 来なくても いいです。"], "popup_priority": "low"}, {"id": "m1_L17_5", "source": "minna1", "lesson": "Lesson 17", "rule": "5. Making an object the topic of a sentence", "meaning": "When making an object (N を) into the topic of a sentence, the noun is placed at the beginning of the sentence and the particle を is replaced by the particle は.", "connection": "Nは ＋ ...", "examples": ["荷物は ここに 置かないで ください。", "昼ごはんは 会社の 食堂で 食べます。"], "popup_priority": "low"}, {"id": "m1_L17_6", "source": "minna1", "lesson": "Lesson 17", "rule": "6. N(time)までに V", "meaning": "This indicates a time by which an event will end or an action must be completed. (Distinct from まで which indicates the end point of a continuing action).", "connection": "N(time) までに ＋ V", "examples": ["会議は 5時までに 終わります。", "土曜日までに 本を 返さなければ なりません。"], "popup_priority": "low"}, {"id": "m1_L18_1", "source": "minna1", "lesson": "Lesson 18", "rule": "1. Dictionary form of verbs", "meaning": "The basic form of a verb as given in the dictionary. Group I: final い-column sound changes to う-column. Group II: add る. Group III: する, くる.", "connection": "Conjugated to V-dictionary form", "examples": ["かき-ます → かく", "たべ-ます → たべる", "き-ます → くる"], "popup_priority": "low"}, {"id": "m1_L18_2", "source": "minna1", "lesson": "Lesson 18", "rule": "2. N / V-dictionary form こと が できます", "meaning": "Can do... Indicates that a person has the ability to do something or that some behaviour is possible as a result of the situation.", "connection": "N / V-dictionary form ＋ こと ＋ が できます", "examples": ["ミラーさんは 日本語が できます。", "雪が たくさん 降りましたから、ことしは スキーが できます。", "ミラーさんは 漢字を 読む ことが できます。", "カードで 払う ことが できます。"], "popup_priority": "low"}, {"id": "m1_L18_3", "source": "minna1", "lesson": "Lesson 18", "rule": "3. わたしの 趣味は N / V-dictionary form こと です", "meaning": "My interest is... Using the V-dictionary form こと enables the interest to be described more specifically than just using a noun.", "connection": "わたしの 趣味は ＋ N / V-dictionary form ＋ こと ＋ です", "examples": ["わたしの 趣味は 音楽です。", "わたしの 趣味は 音楽を 聞く ことです。"], "popup_priority": "low"}, {"id": "m1_L18_4", "source": "minna1", "lesson": "Lesson 18", "rule": "4. V1-dictionary form / Nの / Quantifier (time period) まえに、V2", "meaning": "...before... This sentence pattern shows that V2 occurs before V1. V1 always takes the dictionary form regardless of the tense of V2.", "connection": "V-dictionary form / Nの / Quantifier ＋ まえに、V2", "examples": ["日本へ 来る まえに、日本語を 勉強しました。", "寝る まえに、本を 読みます。", "食事の まえに、手を 洗います。", "田中さんは 1時間まえに、出かけました。"], "popup_priority": "low"}, {"id": "m1_L18_5", "source": "minna1", "lesson": "Lesson 18", "rule": "5. なかなか", "meaning": "When なかなか is followed by a negative expression, it means 'not easily' or 'not as expected'.", "connection": "なかなか ＋ V(negative)", "examples": ["日本では なかなか 馬を 見る ことが できません。"], "popup_priority": "low"}, {"id": "m1_L18_6", "source": "minna1", "lesson": "Lesson 18", "rule": "6. ぜひ", "meaning": "ぜひ is used by speakers to intensify their expressions of hope or requests.", "connection": "ぜひ ＋ ...", "examples": ["ぜひ 北海道へ 行きたいです。", "ぜひ 遊びに 来て ください。"], "popup_priority": "low"}, {"id": "m1_L19_1", "source": "minna1", "lesson": "Lesson 19", "rule": "1. Vた-form", "meaning": "Forms of verbs ending in た or だ are called their た-form. Created by changing the て or で of its て-form to た or だ respectively.", "connection": "Conjugated to Vた-form", "examples": ["かいて → かいた", "のんで → のんだ", "たべて → たべた"], "popup_priority": "low"}, {"id": "m1_L19_2", "source": "minna1", "lesson": "Lesson 19", "rule": "2. Vた-form ことが あります", "meaning": "have the experience of V-ing. This sentence pattern is used to say what happened in the past as a particular experience.", "connection": "Vた-form ＋ ことが あります", "examples": ["馬に 乗った ことが あります。"], "popup_priority": "low"}, {"id": "m1_L19_3", "source": "minna1", "lesson": "Lesson 19", "rule": "3. V1た-formり、V2た-formり します", "meaning": "V1, V2 and so on... Used to enumerate a few typical actions from a longer list, indicating no time relationship between them. The tense is shown at the end.", "connection": "V1た-formり、V2た-formり します", "examples": ["日曜日は テニスを したり、映画を 見たり します。", "日曜日は テニスを したり、映画を 見たり しました。"], "popup_priority": "low"}, {"id": "m1_L19_4", "source": "minna1", "lesson": "Lesson 19", "rule": "4. い-adj (～く) / な-adj (～に) / Nに なります", "meaning": "become... なります indicates a change of state.", "connection": "い-adj (drop い) ＋ く / な-adj (drop な) ＋ に / N ＋ に ＋ なります", "examples": ["寒く なります", "元気に なります", "25歳に なります"], "popup_priority": "low"}, {"id": "m1_L20_1", "source": "minna1", "lesson": "Lesson 20", "rule": "1. Polite style and plain style", "meaning": "The Japanese language has two styles of speech: polite style and plain style. The predicates used in polite-style sentences end in です or ます, while the plain style uses the plain form.", "connection": "Polite style / Plain style", "examples": ["あした 東京へ 行きます。 (Polite)", "あした 東京へ 行く。 (Plain)", "毎日 忙しいです。 (Polite)", "毎日 忙しい。 (Plain)", "相撲が 好きです。 (Polite)", "相撲が 好きだ。 (Plain)"], "popup_priority": "low"}, {"id": "m1_L20_2", "source": "minna1", "lesson": "Lesson 20", "rule": "2. Proper use of the polite style or plain style", "meaning": "The polite style is used when speaking to a person met for the first time or of higher status. The plain style is used when talking to close friends, colleagues, and family members, or when writing dissertations, reports, and diaries.", "connection": "N/A", "examples": [], "popup_priority": "low"}, {"id": "m1_L20_3", "source": "minna1", "lesson": "Lesson 20", "rule": "3. Conversation in the plain style", "meaning": "Questions omit か and use rising intonation. だ is often omitted in affirmative noun/na-adj answers. Certain particles (は, が, を) are omitted if meaning is evident. The い in Vて-form いる is dropped. けど works the same way as が.", "connection": "Plain form conversation rules", "examples": ["コーヒーを 飲む？……うん、飲む。", "今晩 暇？……うん、暇／暇だ／暇だよ。", "ごはん 食べる？", "あした 京都 行かない？", "この りんご おいしいね。", "そこに はさみ ある？", "辞書、持って る？……うん、持って る。／……ううん、持って ない。", "その カレー おいしい？……うん、辛いけど、おいしい。", "相撲の チケット あるけど、いっしょに 行かない？"], "popup_priority": "low"}, {"id": "m1_L21_1", "source": "minna1", "lesson": "Lesson 21", "rule": "1. Plain form と 思います", "meaning": "I think that... The ideas or judgements expressed with おもいます are indicated by the particle と. Used when expressing conjecture or stating an opinion.", "connection": "Plain form ＋ と 思います", "examples": ["あした 雨が 降ると 思います。", "日本は 物価が 高いと 思います。", "新しい 空港に ついて どう 思いますか。"], "popup_priority": "low"}, {"id": "m1_L21_2", "source": "minna1", "lesson": "Lesson 21", "rule": "2. \"Sentences\" / Plain form と 言います", "meaning": "say... The particle と is used to report speech, either directly (repeated word for word in quotes) or indirectly (using the plain form).", "connection": "\"Sentences\" / Plain form ＋ と 言います", "examples": ["寝る まえに、「お休みなさい」と 言います。", "ミラーさんは 東京へ 出張すると 言いました。"], "popup_priority": "low"}, {"id": "m1_L21_3", "source": "minna1", "lesson": "Lesson 21", "rule": "3. Plain form でしょう？", "meaning": "...right? This sentence form is used when seeking agreement or confirmation from the listener. Spoken with a rising intonation.", "connection": "[V / い-adj / な-adj / N plain form] ＋ でしょう？ (* な-adj and N drop ～だ)", "examples": ["あした パーティーに 行くでしょう？……ええ、行きます。", "北海道は 寒かったでしょう？"], "popup_priority": "low"}, {"id": "m1_L21_4", "source": "minna1", "lesson": "Lesson 21", "rule": "4. N1（place）で N2が あります", "meaning": "When N2 is a ceremony or event such as a party, concert, festival, or incident, あります is used in the sense of 'to take place', 'to be held', or 'to occur'.", "connection": "N1（place）で N2 が あります", "examples": ["東京で 日本と ブラジルの サッカーの 試合が あります。"], "popup_priority": "low"}, {"id": "m1_L21_5", "source": "minna1", "lesson": "Lesson 21", "rule": "5. N（occasion）で", "meaning": "The occasion at which an action takes place is marked by で.", "connection": "N（occasion）で", "examples": ["会議で 何か 意見を 言いましたか。"], "popup_priority": "low"}, {"id": "m1_L21_6", "source": "minna1", "lesson": "Lesson 21", "rule": "6. Nでも V", "meaning": "When recommending, suggesting, or expressing a hope for something, the particle でも is used to give an example, without restricting it to a specific one.", "connection": "N ＋ でも ＋ V", "examples": ["ちょっと ビールでも 飲みませんか。"], "popup_priority": "low"}, {"id": "m1_L21_7", "source": "minna1", "lesson": "Lesson 21", "rule": "7. Vない-formないと……", "meaning": "This expression means 'must do...'. It is created by omitting いけません from Vない-form ないと いけません.", "connection": "Vない-form ＋ ないと……", "examples": ["もう 帰らないと……。"], "popup_priority": "low"}, {"id": "m1_L22_1", "source": "minna1", "lesson": "Lesson 22", "rule": "1. Noun modification", "meaning": "Verbs, adjectives and nouns in a clause that modifies a noun are in the plain form. The subject of a noun-modifying clause is marked by が.", "connection": "[V / い-adj plain form / な-adj な / N の] ＋ N", "examples": ["これは ミラーさんが 住んで いた うちです。", "ミラーさんが 住んで いた うちを 買いました。", "わたしは カリナさんが かいた 絵が 好きです。"], "popup_priority": "low"}, {"id": "m1_L22_2", "source": "minna1", "lesson": "Lesson 22", "rule": "2. V-dictionary form 時間／約束／用事", "meaning": "When talking about the time required for doing something or describing an appointment, errand, etc., the verb is put in the dictionary form and placed in front of the noun.", "connection": "V-dictionary form ＋ 時間 / 約束 / 用事", "examples": ["わたしは 朝ごはんを 食べる 時間が ありません。", "わたしは 友達と 映画を 見る 約束が あります。", "きょうは 市役所へ 行く 用事が あります。"], "popup_priority": "low"}, {"id": "m1_L22_3", "source": "minna1", "lesson": "Lesson 22", "rule": "3. Vます-formましょうか", "meaning": "Shall we...? An expression for when the speaker is suggesting to the listener that they do something together.", "connection": "Vます-form (drop ます) ＋ ましょうか", "examples": ["この 部屋、きょう 見る ことが できますか。……ええ。今から 行きましょうか。"], "popup_priority": "low"}, {"id": "m1_L23_1", "source": "minna1", "lesson": "Lesson 23", "rule": "1. とき、～ (When...)", "meaning": "とき connects two sentences while expressing a time or occasion when the state or action described in the main sentence exists or occurs.", "connection": "[V-dictionary form / Vない-formない / い-adj（～い） / な-adj な / N の] ＋ とき、～", "examples": ["図書館で 本を 借りる とき、カードが 要ります。", "暇な とき、うちへ 遊びに 来ませんか。", "妻が 病気の とき、会社を 休みます。"], "popup_priority": "low"}, {"id": "m1_L23_2", "source": "minna1", "lesson": "Lesson 23", "rule": "2. V-dictionary form / Vた-form とき、～", "meaning": "When the verb before とき is in the dictionary form, the action in the main clause happens before it. When it is in the た-form, the action in the main clause happens after it.", "connection": "V-dictionary form / Vた-form ＋ とき、～", "examples": ["パリへ 行く とき、かばんを 買いました。 (Bought on the way)", "パリへ 行った とき、かばんを 買いました。 (Bought in Paris)"], "popup_priority": "low"}, {"id": "m1_L23_3", "source": "minna1", "lesson": "Lesson 23", "rule": "3. V-dictionary formと、～", "meaning": "If... then... Indicates that if a certain action or phenomenon occurs, then another action or phenomenon will inevitably occur.", "connection": "V-dictionary form ＋ と、～", "examples": ["この ボタンを 押すと、お釣りが 出ます。", "右へ 曲がると、郵便局が あります。"], "popup_priority": "low"}, {"id": "m1_L23_4", "source": "minna1", "lesson": "Lesson 23", "rule": "4. Nが adj", "meaning": "が is used when describing a phenomenon perceived with the senses or objectively reporting an event. It can be used with adjective sentences as well.", "connection": "N が ＋ adj", "examples": ["音が 小さいです。"], "popup_priority": "low"}, {"id": "m1_L23_5", "source": "minna1", "lesson": "Lesson 23", "rule": "5. Nを motionV", "meaning": "を is used with motion verbs such as さんぽします, わたります, and あるきます to indicate the place that people or things pass through.", "connection": "N(place) を ＋ motionV", "examples": ["公園を 散歩します。", "交差点を 右へ 曲がりま he completion of a matter or action the speaker is certain will happen.", "connection": "Vた-form ＋ ら、～", "examples": ["10時に なったら、出かけましょう。", "うちへ 帰ったら、すぐ シャワーを 浴びます。"], "popup_priority": "low"}, {"id": "m1_L25_3", "source": "minna1", "lesson": "Lesson 25", "rule": "3. Vて-formも、～", "meaning": "Even if... Presents contrasting conditions. Describes something that will happen that would not normally be expected if what was stated in the condition were true.", "connection": "Vて-form / Vない-formなくて / い-adj(～くて) / な-adj/N(で) ＋ も、～", "examples": ["雨が 降っても、洗濯します。", "便利でも、パソコンを 使いません。", "日曜日でも、働きます。"], "popup_priority": "low"}, {"id": "m1_L25_4", "source": "minna1", "lesson": "Lesson 25", "rule": "4. もし", "meaning": "Used in conjunction with ～たら to give notice that the clause following it is conditional. It intensifies the speaker's sense of conditionality.", "connection": "もし ＋ conditional clause (～たら)", "examples": ["もし 1億円 あったら、いろいろな 国を 旅行したいです。"], "popup_priority": "low"}, {"id": "m1_L25_5", "source": "minna1", "lesson": "Lesson 25", "rule": "5. Subject of a subordinate clause", "meaning": "The subject of a subordinate clause containing ～たら, ～ても, ～てから, ～とき, ～と, ～まえに, etc., is marked by が, not は.", "connection": "N が ＋ subordinate clause", "examples": ["友達が 約束の 時間に 来なかったら、どう しますか。", "妻が 病気の とき、会社を 休みます。"], "popup_priority": "low"}];

var sourceNames = {
  'intermediate': '中級へ行こう',
  'taskbased': 'タスクベース',
  'minna2': 'みんなの日本語 II',
  'minna1': 'みんなの日本語 I'
};
var sourceOrder = ['intermediate','taskbased','minna2','minna1'];
var selectedLessons = new Set();
var filteredPool = [];
var currentDeck = [];
var deckIndex = 0;
var flipped = false;
var globalIndex = 0;

function init() {
  var bySource = {};
  grammarData.forEach(function(g) {
    if (!bySource[g.source]) bySource[g.source] = {};
    if (!bySource[g.source][g.lesson]) bySource[g.source][g.lesson] = 0;
    bySource[g.source][g.lesson]++;
    selectedLessons.add(g.source + '|' + g.lesson);
  });

  var html = '';
  sourceOrder.forEach(function(src) {
    if (!bySource[src]) return;
    var lessons = Object.keys(bySource[src]).sort(function(a,b) {
      var na = parseInt((a.match(/\d+/)||['0'])[0]), nb = parseInt((b.match(/\d+/)||['0'])[0]);
      return na - nb;
    });
    var total = 0; lessons.forEach(function(l){ total += bySource[src][l]; });
    html += '<div class="tree-book open" id="book-' + src + '">';
    html += '<label class="tree-book-label" onclick="event.stopPropagation()">';
    html += '<input type="checkbox" checked onchange="toggleBook(\'' + src + '\',this.checked)"> ';
    html += sourceNames[src] + ' <span style="font-weight:400;color:var(--text-light);font-size:0.72rem;">(' + total + ')</span>';
    html += ' <span class="tree-toggle" onclick="event.preventDefault();toggleTreeOpen(\'' + src + '\')">&#9660;</span>';
    html += '</label>';
    html += '<div class="tree-lessons">';
    lessons.forEach(function(l) {
      var key = src + '|' + l;
      html += '<label class="tree-lesson"><input type="checkbox" checked data-key="' + key + '" onchange="toggleLessonCB(this)"> ' + l + ' (' + bySource[src][l] + ')</label>';
    });
    html += '</div></div>';
  });
  document.getElementById('sourceTree').innerHTML = html;
  updateCount();
}

function toggleTreeOpen(src) {
  document.getElementById('book-' + src).classList.toggle('open');
}

function toggleBook(src, checked) {
  var cbs = document.querySelectorAll('#book-' + src + ' .tree-lesson input');
  cbs.forEach(function(cb) {
    cb.checked = checked;
    var key = cb.getAttribute('data-key');
    if (checked) selectedLessons.add(key);
    else selectedLessons.delete(key);
  });
  updateCount();
}

function toggleLessonCB(cb) {
  var key = cb.getAttribute('data-key');
  if (cb.checked) selectedLessons.add(key);
  else selectedLessons.delete(key);
  var src = key.split('|')[0];
  var allCbs = document.querySelectorAll('#book-' + src + ' .tree-lesson input');
  var allChecked = true;
  allCbs.forEach(function(c){ if(!c.checked) allChecked = false; });
  document.querySelector('#book-' + src + ' > label input').checked = allChecked;
  updateCount();
}

function getCheckedFields(containerId) {
  var fields = [];
  document.querySelectorAll('#' + containerId + ' input:checked').forEach(function(cb) {
    fields.push(cb.value);
  });
  return fields;
}

function getFilteredPool() {
  return grammarData.filter(function(g) {
    return selectedLessons.has(g.source + '|' + g.lesson);
  });
}

function updateCount() {
  filteredPool = getFilteredPool();
  document.getElementById('selectedCount').textContent = filteredPool.length + ' grammar points selected';
}

function startReview() {
  filteredPool = getFilteredPool();
  if (filteredPool.length === 0) { alert('No grammar points selected.'); return; }
  if (getCheckedFields('frontChecks').length === 0) { alert('Select at least one field for the front.'); return; }
  if (getCheckedFields('backChecks').length === 0) { alert('Select at least one field for the back.'); return; }
  globalIndex = 0;
  loadBatch();
}

function loadBatch() {
  var batchSize = parseInt(document.getElementById('batchSize').value) || 10;
  var remaining = filteredPool.slice(globalIndex);
  if (remaining.length === 0) { globalIndex = 0; remaining = filteredPool.slice(0); }
  var batch = remaining.slice(0, batchSize);
  if (document.getElementById('randomize').checked) {
    for (var i = batch.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = batch[i]; batch[i] = batch[j]; batch[j] = t;
    }
  }
  currentDeck = batch;
  deckIndex = 0;
  flipped = false;
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('summaryPanel').classList.remove('active');
  document.getElementById('cardArea').classList.add('active');
  showCard();
}

function showCard() {
  if (deckIndex >= currentDeck.length) {
    globalIndex += parseInt(document.getElementById('batchSize').value) || 10;
    document.getElementById('cardArea').classList.remove('active');
    document.getElementById('summaryPanel').classList.add('active');
    var remaining = filteredPool.length - globalIndex;
    document.getElementById('summaryText').textContent = 'You reviewed ' + currentDeck.length + ' grammar points.' + (remaining > 0 ? ' ' + remaining + ' remaining.' : ' All done!');
    return;
  }
  flipped = false;
  document.getElementById('progressBar').textContent = (deckIndex + 1) + ' / ' + currentDeck.length;
  renderCard(currentDeck[deckIndex], false);
}

function flipCard() { flipped = !flipped; renderCard(currentDeck[deckIndex], flipped); }

function renderCard(g, showBack) {
  var fields = showBack ? getCheckedFields('backChecks') : getCheckedFields('frontChecks');
  var html = '';
  fields.forEach(function(f) {
    if (f === 'rule') {
      html += '<div class="fc-main">' + esc(g.rule) + '</div>';
    } else if (f === 'meaning') {
      html += '<div class="fc-sub">' + esc(g.meaning) + '</div>';
    } else if (f === 'connection') {
      if (g.connection) html += '<div class="fc-sub" style="font-style:italic;margin-top:0.3rem;">Pattern: ' + esc(g.connection) + '</div>';
    } else if (f === 'source') {
      html += '<div class="fc-source">' + sourceNames[g.source] + ' \u2014 ' + g.lesson + '</div>';
    } else if (f === 'examples') {
      if (g.examples && g.examples.length > 0) {
        html += '<div class="fc-examples">';
        g.examples.forEach(function(ex) { html += '<div class="fc-example">' + esc(ex) + '</div>'; });
        html += '</div>';
      }
    }
  });
  if (!html) html = '<div class="fc-sub" style="color:var(--border);">No fields selected</div>';
  document.getElementById('flashcardContent').innerHTML = html;
}

function nextCard() { deckIndex++; showCard(); }
function prevCard() { if (deckIndex > 0) { deckIndex--; showCard(); } }
function nextBatch() { loadBatch(); }
function repeatBatch() { globalIndex -= parseInt(document.getElementById('batchSize').value) || 10; if (globalIndex < 0) globalIndex = 0; loadBatch(); }
function endReview() {
  document.getElementById('cardArea').classList.remove('active');
  document.getElementById('summaryPanel').classList.remove('active');
  document.getElementById('setupPanel').style.display = '';
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

init();

</script>
