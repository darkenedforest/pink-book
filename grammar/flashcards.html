<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ec;--card-bg:#fffdf8;--text:#2c2416;--text-light:#6b5d4d;--accent:#b8433a;--border:#e0d5c5;--grammar-color:#7b2d8e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Source Sans Pro',sans-serif;background:linear-gradient(160deg,#f7f3ec,#efe8dc);color:var(--text);min-height:100vh;}
.container{max-width:680px;margin:0 auto;padding:1.5rem 1.2rem 3rem;}
.back-link{display:inline-block;font-size:0.85rem;color:var(--text-light);text-decoration:none;margin-bottom:1rem;}
.back-link:hover{color:var(--accent);}
.header{text-align:center;margin-bottom:1rem;}
.header h1{font-family:'Noto Serif JP',serif;font-size:1.5rem;font-weight:700;margin-bottom:0.2rem;}
.header p{font-size:0.82rem;color:var(--text-light);}
.ornament{display:block;margin:0.6rem auto 1rem;width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}

/* Setup panel */
.setup{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem;}
.setup-title{font-weight:700;font-size:0.85rem;margin-bottom:0.6rem;}

/* Tiered checkboxes */
.tree{margin-bottom:0.8rem;}
.tree-book{margin-bottom:0.4rem;}
.tree-book-label{display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;font-weight:700;cursor:pointer;}
.tree-book-label input{accent-color:var(--accent);}
.tree-lessons{padding-left:1.4rem;display:flex;flex-wrap:wrap;gap:0.1rem 0.8rem;max-height:0;overflow:hidden;transition:max-height 0.3s;}
.tree-book.open .tree-lessons{max-height:500px;}
.tree-lesson{display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:var(--text-light);cursor:pointer;}
.tree-lesson input{accent-color:var(--accent);}
.tree-toggle{font-size:0.65rem;color:var(--text-light);cursor:pointer;margin-left:0.3rem;}

/* Front/back checkboxes */
.fb-row{display:flex;gap:1.5rem;margin-bottom:0.8rem;flex-wrap:wrap;}
.fb-group{flex:1;min-width:140px;}
.fb-label{font-size:0.72rem;font-weight:700;color:var(--text-light);margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.04em;}
.fb-checks{display:flex;flex-direction:column;gap:0.2rem;}
.fb-check{display:flex;align-items:center;gap:0.3rem;font-size:0.78rem;cursor:pointer;}
.fb-check input{accent-color:var(--accent);}

/* Batch controls */
.batch-row{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.8rem;flex-wrap:wrap;}
.batch-input{
  width:60px;padding:0.35rem 0.5rem;border:1px solid var(--border);border-radius:8px;
  font-size:0.85rem;text-align:center;font-family:'Source Sans Pro',sans-serif;
}
.batch-label{font-size:0.78rem;color:var(--text-light);}
.btn{
  padding:0.5rem 1.2rem;border:none;border-radius:8px;font-family:'Source Sans Pro',sans-serif;
  font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:0.85;}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text-light);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:0.35rem 0.8rem;font-size:0.75rem;}

/* Flashcard */
.card-area{display:none;text-align:center;}
.card-area.active{display:block;}
.progress-bar{font-size:0.75rem;color:var(--text-light);margin-bottom:0.8rem;}
.flashcard{
  background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
  min-height:220px;display:flex;align-items:center;justify-content:center;
  padding:2rem 1.5rem;margin:0 auto 1rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(44,36,22,0.06);transition:all 0.2s;
  max-width:500px;position:relative;
}
.flashcard:hover{box-shadow:0 8px 28px rgba(44,36,22,0.1);}
.flashcard-content{width:100%;}
.fc-main{font-family:'Noto Sans JP',sans-serif;font-size:1.4rem;font-weight:700;color:var(--grammar-color);line-height:1.5;margin-bottom:0.5rem;}
.fc-sub{font-size:0.88rem;color:var(--text);line-height:1.6;}
.fc-examples{margin-top:0.8rem;text-align:left;}
.fc-example{
  font-family:'Noto Sans JP',sans-serif;font-size:0.85rem;color:var(--text);
  line-height:1.6;padding:0.3rem 0 0.3rem 0.8rem;border-left:2px solid var(--grammar-color);margin:0.3rem 0;
}
.fc-hint{font-size:0.68rem;color:var(--border);position:absolute;bottom:0.6rem;right:0.8rem;}
.fc-source{font-size:0.65rem;color:var(--text-light);margin-top:0.6rem;font-style:italic;}
.card-nav{display:flex;justify-content:center;gap:0.8rem;margin-top:0.5rem;}
.card-nav .btn{min-width:100px;}

/* Summary */
.summary{display:none;text-align:center;padding:2rem 0;}
.summary.active{display:block;}
.summary h2{font-family:'Noto Serif JP',serif;font-size:1.3rem;margin-bottom:0.5rem;}
.summary p{font-size:0.88rem;color:var(--text-light);margin-bottom:1rem;}

@media(max-width:520px){
  .header h1{font-size:1.3rem;}
  .fc-main{font-size:1.2rem;}
  .flashcard{min-height:180px;padding:1.5rem 1rem;}
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">&larr; Grammar Reference</a>
  <div class="header">
    <h1>Grammar Flashcards</h1>
    <p>Review grammar points with customizable cards</p>
  </div>
  <span class="ornament"></span>

  <!-- SETUP -->
  <div class="setup" id="setupPanel">
    <div class="setup-title">Select Grammar Points</div>
    <div class="tree" id="sourceTree"></div>

    <div class="setup-title">Card Front (what you see first)</div>
    <div class="fb-row">
      <div class="fb-group">
        <div class="fb-checks" id="frontChecks">
          <label class="fb-check"><input type="checkbox" value="rule" checked> Pattern</label>
          <label class="fb-check"><input type="checkbox" value="source"> Source book &amp; lesson</label>
          <label class="fb-check"><input type="checkbox" value="connection"> Connection pattern</label>
          <label class="fb-check"><input type="checkbox" value="examples"> Example sentences</label>
        </div>
      </div>
    </div>

    <div class="setup-title">Card Back (what you see after flip)</div>
    <div class="fb-row">
      <div class="fb-group">
        <div class="fb-checks" id="backChecks">
          <label class="fb-check"><input type="checkbox" value="meaning" checked> Meaning / Explanation</label>
          <label class="fb-check"><input type="checkbox" value="rule"> Pattern</label>
          <label class="fb-check"><input type="checkbox" value="source"> Source book &amp; lesson</label>
          <label class="fb-check"><input type="checkbox" value="connection" checked> Connection pattern</label>
          <label class="fb-check"><input type="checkbox" value="examples" checked> Example sentences</label>
        </div>
      </div>
    </div>

    <div class="batch-row">
      <span class="batch-label">Batch size:</span>
      <input type="number" class="batch-input" id="batchSize" value="10" min="1" max="100">
      <label style="font-size:0.78rem;color:var(--text-light);cursor:pointer;"><input type="checkbox" id="randomize" checked> Randomize</label>
    </div>

    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-primary" onclick="startReview()">Start Review</button>
      <span class="batch-label" id="selectedCount">0 grammar points selected</span>
    </div>
  </div>

  <!-- FLASHCARD AREA -->
  <div class="card-area" id="cardArea">
    <div class="progress-bar" id="progressBar">1 / 10</div>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-content" id="flashcardContent"></div>
      <div class="fc-hint">tap to flip</div>
    </div>
    <div class="card-nav">
      <button class="btn btn-outline" onclick="prevCard()">← Back</button>
      <button class="btn btn-outline btn-sm" onclick="endReview()">End</button>
      <button class="btn btn-primary" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary" id="summaryPanel">
    <h2>Batch Complete</h2>
    <p id="summaryText">You reviewed 10 grammar points.</p>
    <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="repeatBatch()">Repeat Batch</button>
      <button class="btn btn-primary" onclick="nextBatch()">Next Batch</button>
      <button class="btn btn-outline" onclick="endReview()">Back to Setup</button>
    </div>
  </div>
</div>

を通じて", "meaning": "through N/Ving. indicates a means for gaining knowledge or experience. Verbs such as 知る, 学ぶ, 理解する, 知り合う often follows. Usually N is used rather than Nすること before 通して／通じて.", "connection": "N / Vること ＋ を通して / を通じて", "examples": ["留学の経験を通して、日本のことがもっとわかるようになった。", "レポートを書くことを通して、日本語の書き言葉を学ぶ。", "彼とは大学のサークルを通じて知り合った。", "本をとおして、あたらしいことばをまなびました。"], "popup_priority": "high"}, {"id": "tb_L1-2_1", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "1. S(p)＋と言われている / S(p)＋と考えられている", "meaning": "it is said / it is considered that. Used to express what is generally believed or considered.", "connection": "S(plain form) ＋ と言われている / と考えられている", "examples": ["漢字は３世紀ごろ中国から伝えられたと言われている。", "日本では、４は良くない数字だと考えられている。", "早起きは体に良いと考えられているが、本当だろうか。"], "popup_priority": "high"}, {"id": "tb_L1-2_2", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "2. Nのように / N1のようなN2", "meaning": "like N / N2 such as N1. This structure is used to give N as example(s).", "connection": "N のように / N1 のような N2", "examples": ["私は、山本先生のように、学生の気持ちがよくわかる先生になりたい。", "レモンやオレンジのようなすっぱい果物はビタミンCが多いと言われている。"], "popup_priority": "high"}, {"id": "tb_L1-2_3", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "3. V(る、ない)＋ことがある", "meaning": "sometimes V. Indicates that an action or event occurs occasionally.", "connection": "V(dictionary form / ない-form) ＋ ことがある", "examples": ["彼は、時々授業を休むことがある。", "Aさん「いつもどうやって駅まで行きますか。」 Bさん「だいたいバスで行きますが、時々、歩いて行くこともあります。」", "忙しすぎて、すぐにメールの返事ができないこともある。"], "popup_priority": "high"}, {"id": "tb_L1-2_4", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "4. Vます＋やすい、Vます＋にくい", "meaning": "easy/difficult to do. Vやすい／にくい indicates the easiness/difficulty of doing something. The verb can be either transitive or intransitive.", "connection": "Vます-form (drop ます) ＋ やすい / にくい", "examples": ["Aさん「この本、難しいですか。」 Bさん「いえ、説明が詳しいので、わかりやすいですよ。」", "あの店のハンバーガーを食べてみたが、大きすぎて食べにくかった。"], "popup_priority": "high"}, {"id": "tb_L1-2_5", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "5. V(p)＋ことによって", "meaning": "by V-ing. ことによって indicates the cause or means.", "connection": "V(plain form) ＋ ことによって", "examples": ["日本のアニメを見ることによって、新しい言葉をたくさん覚えることができた。", "ガンジーの伝記を読んだことによって、私の考え方は変わった。", "たばこを吸うことによって、将来、病気になる可能性が高くなるそうだ。"], "popup_priority": "high"}, {"id": "tb_L1-2_6", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "6. S(p)＋ところ、S(p)＋点", "meaning": "aspect; part; point. ところ／点, accompanying a modifier, indicates a specific aspect of properties or personalities. 点 gives a more formal impression than ところ.", "connection": "S(plain form) / AN な / N である ＋ ところ、点", "examples": ["Aさん「彼女のどんなところが好きになったんですか。」 Bさん「そうですね。絶対にあきらめないところかな。」", "今住んでいるアパートは、部屋が広くて静かなところが気に入っている。", "この会社の特徴は、社員が全員大学生である点だ。", "今日の発表の良かった点は、スライドがきれいでわかりやすかったところだ。"], "popup_priority": "high"}, {"id": "tb_L1-2_7", "source": "taskbased", "lesson": "Lesson 1-2", "rule": "7. 日本語のスタイル", "meaning": "In Japanese, the style changes depending on the scene, the person you are talking to, and the purpose. 1. The plain style (普通体) is often used in writing such as newspaper articles, magazines, website news, and in academic settings. 2. The plain style is also used when talking or writing casually to close persons such as family members and friends.", "connection": "普通体 The plain style", "examples": [], "popup_priority": "high"}, {"id": "m2_L26_1", "source": "minna2", "lesson": "Lesson 26", "rule": "1. ～んです", "meaning": "Used to ask the listener to confirm something seen or heard, ask for more detailed information, ask for a reason, or to give a reason or explanation. It is used in speech, whereas ～のです is used in writing. [2]", "connection": "[V / i-adj / na-adj / N plain form] ＋ んです (* na-adj and N use ～な instead of ～だ) [2]", "examples": ["（ぬれた 傘を 持って いる 人を 見て）雨が 降って いるんですか。 [2]", "おもしろい デザインの 靴ですね。どこで 買ったんですか。 [2]", "どうして 遅れたんですか。……バスが 来なかったんです。 [2]"], "popup_priority": "medium"}, {"id": "m2_L26_2", "source": "minna2", "lesson": "Lesson 26", "rule": "2. Vて-form いただけませんか", "meaning": "This is a more polite way of asking for something than ～て ください (Would you be so kind as to ~?). [3]", "connection": "Vて-form ＋ いただけませんか [3]", "examples": ["いい 先生を 紹介して いただけませんか。 [3]"], "popup_priority": "medium"}, {"id": "m2_L26_3", "source": "minna2", "lesson": "Lesson 26", "rule": "3. Interrogative Vた-form ら いいですか", "meaning": "This is a way of asking for advice or instructions (What/When/Where/Which/How/Who should I ~?). [3]", "connection": "Interrogative ＋ Vた-form ＋ ら いいですか [3]", "examples": ["どこで カメラを 買ったら いいですか。……ABC ストアが 安いですよ。 [3]", "国会議事堂を 見学したいんですが、どう したら いいですか。 [3]"], "popup_priority": "medium"}, {"id": "m2_L26_4", "source": "minna2", "lesson": "Lesson 26", "rule": "4. N(object) は 好きです／嫌いです／上手です／下手です／あります, etc.", "meaning": "Making a direct object, normally marked by が, into the topic of a sentence by replacing が with は. [3]", "connection": "N(object) は ＋ 好きです / あります [3]", "examples": ["よく カラオケに 行きますか。……いいえ、あまり 行きません。カラオケは 好きじゃ ないんです。 [3]"], "popup_priority": "medium"}, {"id": "m2_L27_1", "source": "minna2", "lesson": "Lesson 27", "rule": "1. Potential verbs (可能動詞)", "meaning": "Potential verbs indicate states, not actions, and are used to state someone's ability to do something or that an action is possible in a certain situation. The object is usually indicated by が. [4]", "connection": "Group I: change final ~i to ~e; Group II: + られます; Group III: こられます / できます [4]", "examples": ["わたしは 日本語が 話せます。 [4]", "一人で 病院へ 行けますか。 [4]", "ミラーさんは 漢字が 読めます。 [4]"], "popup_priority": "medium"}, {"id": "m2_L27_2", "source": "minna2", "lesson": "Lesson 27", "rule": "2. 見えます and 聞こえます", "meaning": "These are not volitional; they denote something naturally coming into sight or a sound naturally reaching one's ears, independent of one's will. [4]", "connection": "見えます / 聞こえます [4]", "examples": ["新幹線から 富士山が 見えます。 [4]", "ラジオの 音が 聞こえます。 [4]"], "popup_priority": "medium"}, {"id": "m2_L27_3", "source": "minna2", "lesson": "Lesson 27", "rule": "3. できます", "meaning": "The sense of the verb できます introduced here is 'come into being', 'be completed', or 'be made'. [5]", "connection": "できます [5]", "examples": ["駅の 前に 大きい スーパーが できました。 [5]", "時計の 修理は いつ できますか。 [5]"], "popup_priority": "medium"}, {"id": "m2_L27_4", "source": "minna2", "lesson": "Lesson 27", "rule": "4. しか", "meaning": "Appended to nouns or quantifiers, and is always used with a negative. It negates everything except the word to which it is attached, suggesting insufficiency or inadequacy. [5]", "connection": "N / Quantifier ＋ しか ＋ V(negative) [5]", "examples": ["ローマ字しか 書けません。 [5]"], "popup_priority": "medium"}, {"id": "m2_L28_1", "source": "minna2", "lesson": "Lesson 28", "rule": "1. V1 ます-form ながら V2", "meaning": "Indicates that someone performing an action indicated by V1 is simultaneously performing a separate action indicated by V2, where V2 indicates the main action. [6]", "connection": "V1 ます-form ＋ ながら ＋ V2 [6]", "examples": ["音楽を 聞きながら 食事します。 [6]", "働きながら 日本語を 勉強して います。 [6]"], "popup_priority": "medium"}, {"id": "m2_L28_2", "source": "minna2", "lesson": "Lesson 28", "rule": "2. Vて-form います", "meaning": "As well as indicating what someone is doing now, this sentence pattern can also be used to indicate a habitual behaviour. [6]", "connection": "Vて-form ＋ います [6]", "examples": ["毎朝 ジョギングを して います。 [6]", "子どもの とき、毎晩 8時に 寝て いました。 [6]"], "popup_priority": "medium"}, {"id": "m2_L28_3", "source": "minna2", "lesson": "Lesson 28", "rule": "3. Plain form し、plain form し、～", "meaning": "Used when mentioning two or more similar things one after the other about the topic, or when giving reasons for what follows. [6]", "connection": "Plain form ＋ し [6]", "examples": ["鈴木さんは ピアノも 弾けるし、歌も 歌えるし、ダンスも できます。 [6]", "ここは 値段も 安いし、魚も 新しいし、よく 食べに 来ます。 [6]"], "popup_priority": "medium"}, {"id": "m2_L28_4", "source": "minna2", "lesson": "Lesson 28", "rule": "4. それで", "meaning": "Indicates that what is about to be said follows from what has just been said (therefore/so). [7]", "connection": "Sentence 1。それで Sentence 2。 [7]", "examples": ["ここは コーヒーも おいしいし、食事も できるし……。……それで 人気が あるんですね。 [7]"], "popup_priority": "medium"}, {"id": "m2_L29_1", "source": "minna2", "lesson": "Lesson 29", "rule": "1. Vて-form います (Intransitive verbs)", "meaning": "Shows that the state resulting from the action indicated by the verb is still continuing. When describing a situation in front of one's eyes, the subject is indicated by が. [8]", "connection": "Intransitive Vて-form ＋ います [8]", "examples": ["窓が 割れて います。 [8]", "電気が ついて います。 [8]", "この いすは 壊れて います。 [8]"], "popup_priority": "medium"}, {"id": "m2_L29_2", "source": "minna2", "lesson": "Lesson 29", "rule": "2. Vて-form しまいました／しまいます", "meaning": "Emphasises that an action has been completed, or indicates a feeling of regret or disappointment on the part of the speaker. [8]", "connection": "Vて-form ＋ しまいました / しまいます [8]", "examples": ["漢字の 宿題は もう やって しまいました。 [8]", "パスポートを なくして しまいました。 [8]", "パソコンが 故障して しまいました。 [8]"], "popup_priority": "medium"}, {"id": "m2_L29_3", "source": "minna2", "lesson": "Lesson 29", "rule": "3. ありました", "meaning": "Indicates that the speaker has just found an object they were looking for. It does not mean 'a bag used to be here before'. [9]", "connection": "N ＋ が ＋ ありました [9]", "examples": ["［かばんが］ありましたよ。 [9]"], "popup_priority": "medium"}, {"id": "m2_L30_1", "source": "minna2", "lesson": "Lesson 30", "rule": "1. Vて-form あります", "meaning": "Indicates a continuing state resulting from a purposeful action. Transitive verbs are used for this. [10]", "connection": "N1 に N2 が Vて-form あります / N2 は N1 に Vて-form あります [10]", "examples": ["机の 上に メモが 置いて あります。 [10]", "今月の 予定は カレンダーに 書いて あります。 [10]"], "popup_priority": "medium"}, {"id": "m2_L30_2", "source": "minna2", "lesson": "Lesson 30", "rule": "2. Vて-form おきます", "meaning": "Indicates that a necessary action is to be performed by a certain time, taking temporary measures in preparation, or keeping a resultant state as it is. [10, 11]", "connection": "Vて-form ＋ おきます [10]", "examples": ["旅行の まえに、切符を 買って おきます。 [10]", "はさみを 使ったら、元の 所に 戻して おいて ください。 [10]", "あした 会議が ありますから、いすは この ままに して おいて ください。 [11]"], "popup_priority": "medium"}, {"id": "m2_L30_3", "source": "minna2", "lesson": "Lesson 30", "rule": "3. まだ ＋ affirmative", "meaning": "Used to indicate that an action or situation is continuing ('still'). [11]", "connection": "まだ ＋ Affirmative sentence [11]", "examples": ["まだ 雨が 降って います。 [11]", "……まだ 使って いますから、その ままに して おいて ください。 [11]"], "popup_priority": "medium"}, {"id": "m2_L31_1", "source": "minna2", "lesson": "Lesson 31", "rule": "1. Volitional form", "meaning": "The plain form of ～ましょう. Used in plain-style sentences to suggest or offer to do something.", "connection": "Group I: change い-column to お-column + う / Group II: + よう / Group III: しよう, こよう", "examples": ["ちょっと 休まない？……うん、休もう。", "手伝おうか。", "傘を 持って 行こうか。"], "popup_priority": "medium"}, {"id": "m2_L31_2", "source": "minna2", "lesson": "Lesson 31", "rule": "2. V volitional form と 思っています", "meaning": "Used to convey the speaker's intention to the listener. Compared to と 思います (decision made just now), と 思っています indicates the decision was made some time ago. It can also indicate a third party's intention.", "connection": "V volitional form ＋ と 思っています", "examples": ["週末は 海へ 行こうと 思って います。", "今から 銀行へ 行こうと 思います。", "彼は 学校を 作ろうと 思って います。"], "popup_priority": "medium"}, {"id": "m2_L31_3", "source": "minna2", "lesson": "Lesson 31", "rule": "3. V dictionary form / Vない-form ない つもりです", "meaning": "Expresses the speaker's intention to do or not do something. It sounds more determined than V volitional form と 思っています.", "connection": "V dictionary form / Vない-form ない ＋ つもりです", "examples": ["国へ 帰っても、日本語の 勉強を 続ける つもりです。", "あしたからは たばこを 吸わない つもりです。"], "popup_priority": "medium"}, {"id": "m2_L31_4", "source": "minna2", "lesson": "Lesson 31", "rule": "4. V dictionary form / Nの 予定です", "meaning": "A way of stating something one plans or is scheduled to do.", "connection": "V dictionary form / N の ＋ 予定です", "examples": ["7月の 終わりに ドイツへ 出張する 予定です。", "旅行は 1週間ぐらいの 予定です。"], "popup_priority": "medium"}, {"id": "m2_L31_5", "source": "minna2", "lesson": "Lesson 31", "rule": "5. まだ Vて-form いません", "meaning": "Indicates that a situation has not yet occurred, or something has not yet been done.", "connection": "まだ ＋ Vて-form いません", "examples": ["銀行は まだ 開いて いません。", "レポートは もう 書きましたか。……いいえ、まだ 書いて いません。"], "popup_priority": "medium"}, {"id": "m2_L32_1", "source": "minna2", "lesson": "Lesson 32", "rule": "1. Vた-form / Vない-form ない ほうが いいです", "meaning": "Used to make suggestions or give advice. It implies that it would be bad not to take the action specified by the verb (stronger than ～たら いい).", "connection": "Vた-form / Vない-form ない ＋ ほうが いいです", "examples": ["毎日 運動した ほうが いいですよ。", "熱が あるんです。……じゃ、おふろに 入らない ほうが いいですよ。"], "popup_priority": "medium"}, {"id": "m2_L32_2", "source": "minna2", "lesson": "Lesson 32", "rule": "2. Plain form でしょう", "meaning": "Used when a speaker wants to express an opinion about something in the future or something uncertain, without being definite.", "connection": "[V / い-adj / な-adj / N plain form] ＋ でしょう (* な-adj and N drop ～だ)", "examples": ["あしたは 雨が 降るでしょう。", "タワポンさんは 合格するでしょうか。……きっと 合格するでしょう。"], "popup_priority": "medium"}, {"id": "m2_L32_3", "source": "minna2", "lesson": "Lesson 32", "rule": "3. Plain form かもしれません", "meaning": "Used when the speaker wants to point out that there is a possibility, however small, of ～.", "connection": "[V / い-adj / な-adj / N plain form] ＋ かもしれません (* な-adj and N drop ～だ)", "examples": ["約束の 時間に 間に 合わないかもしれません。"], "popup_priority": "medium"}, {"id": "m2_L32_4", "source": "minna2", "lesson": "Lesson 32", "rule": "4. Vます-form ましょう", "meaning": "Used to convey the speaker's intention to the listener, and is used when announcing an action. It has a more assertive tone than Vます-form ましょうか.", "connection": "Vます-form (drop ます) ＋ ましょう", "examples": ["エンジンの 音が おかしいんですが。……そうですね。故障かも しれません。ちょっと 調べましょう。"], "popup_priority": "medium"}, {"id": "m2_L32_5", "source": "minna2", "lesson": "Lesson 32", "rule": "5. Quantifier で", "meaning": "Shows a time limit, price limit, or other limit.", "connection": "Quantifier ＋ で", "examples": ["駅まで 30分で 行けますか。", "3万円で パソコンが 買えますか。"], "popup_priority": "medium"}, {"id": "m2_L33_1", "source": "minna2", "lesson": "Lesson 33", "rule": "1. Imperative and prohibitive forms", "meaning": "The imperative demands an action; the prohibitive demands an action not be performed. They sound strongly coercive and are mostly used by senior men, in emergencies, group training, sports encouragement, or on signs.", "connection": "Imperative: Gr. I (え-column sound), Gr. II (ろ), Gr. III (しろ, こい) / Prohibitive: V dictionary form ＋ な", "examples": ["早く 寝ろ。", "遅れるな。", "逃げろ。", "エレベーターを 使うな。", "頑張れ。", "止まれ。", "入るな。"], "popup_priority": "medium"}, {"id": "m2_L33_2", "source": "minna2", "lesson": "Lesson 33", "rule": "2. ～と 書いて あります / ～と 読みます", "meaning": "Used to state what is written and how a word/kanji is read.", "connection": "～と ＋ 書いて あります / 読みます", "examples": ["あの 漢字は 何と 読むんですか。", "あそこに「止まれ」と 書いて あります。"], "popup_priority": "medium"}, {"id": "m2_L33_3", "source": "minna2", "lesson": "Lesson 33", "rule": "3. Xは Yという 意味です", "meaning": "Used when defining X. When inquiring as to the meaning of something, the interrogative どういう is used.", "connection": "Xは Yという 意味です / Xは どういう 意味ですか", "examples": ["「立入禁止」は 入るなという 意味です。", "この マークは どういう 意味ですか。……洗濯機で 洗えるという 意味です。"], "popup_priority": "medium"}, {"id": "m2_L33_4", "source": "minna2", "lesson": "Lesson 33", "rule": "4. \"Sentence\" / Plain form と 言っていました", "meaning": "Used for reporting what someone said to a third party.", "connection": "\"Sentence\" / Plain form ＋ と 言っていました", "examples": ["田中さんは「あした 休みます」と 言って いました。", "田中さんは あした 休むと 言って いました。"], "popup_priority": "medium"}, {"id": "m2_L33_5", "source": "minna2", "lesson": "Lesson 33", "rule": "5. \"Sentence\" / Plain form と 伝えて いただけませんか", "meaning": "Used when the speaker is politely asking someone to pass a message on for him or her.", "connection": "\"Sentence\" / Plain form ＋ と 伝えて いただけませんか", "examples": ["ワンさんに「あとで 電話を ください」と 伝えて いただけませんか。", "すみませんが、渡辺さんに あしたの パーティーは 6時からだと 伝えて いただけませんか。"], "popup_priority": "medium"}, {"id": "m2_L34_1", "source": "minna2", "lesson": "Lesson 34", "rule": "1. V1た-form / V1 dictionary form / Nの とおりに、V2", "meaning": "Indicates doing V2 by the same method or under the same conditions as V1, or performing an action without deviating from the standard indicated by N.", "connection": "Vた-form / V dictionary form / Nの ＋ とおりに、V2", "examples": ["わたしが やった とおりに、やって ください。", "見た とおりに 話して ください。", "線の とおりに、紙を 切って ください。", "説明書の とおりに、組み立てました。"], "popup_priority": "medium"}, {"id": "m2_L34_2", "source": "minna2", "lesson": "Lesson 34", "rule": "2. V1た-form / Nの あとで、V2", "meaning": "Indicates that the action denoted by V2 happens after the action or situation denoted by V1 or N. This puts more emphasis on the time context than Vて-form から.", "connection": "Vた-form / Nの ＋ あとで、V2", "examples": ["新しいのを 買った あとで、なくした 時計が 見つかりました。", "仕事の あとで、飲みに 行きませんか。"], "popup_priority": "medium"}, {"id": "m2_L34_3", "source": "minna2", "lesson": "Lesson 34", "rule": "3. V1て-form / V1ない-formないで V2", "meaning": "Indicates that V1 is an action or state that accompanies V2. V1ない-form ないで can also be used to indicate a decision to perform one mutually-exclusive alternative action over another.", "connection": "Vて-form / Vない-form ないで ＋ V2", "examples": ["しょうゆを つけて 食べます。", "しょうゆを つけないで 食べます。", "日曜日は どこも 行かないで、うちで ゆっくり 休みます。"], "popup_priority": "medium"}, {"id": "m2_L35_1", "source": "minna2", "lesson": "Lesson 35", "rule": "1. Conditional form, ～", "meaning": "Expresses something as a precondition for what is expressed in the main clause to happen. Also used to respond to what someone has said or to an explanation of a situation.", "connection": "Gr. I (え-column+ば), Gr. II (れば), Gr. III (すれば, くれば) / Vない (なければ) / い-adj (ければ) / な-adj/N (なら)", "examples": ["ボタンを 押せば、窓が 開きます。", "彼が 行けば、わたしも 行きます。", "あした 都合が よければ、来て ください。", "ボールペンが ないんですが。……ボールペンが なければ、鉛筆で 書いて ください。", "無理なら、金曜日までに 出して ください。"], "popup_priority": "medium"}, {"id": "m2_L35_2", "source": "minna2", "lesson": "Lesson 35", "rule": "2. Interrogative V conditional form いいですか", "meaning": "Used when asking the listener for advice or instructions. Can be used in the same way as ～たら いいですか.", "connection": "Interrogative ＋ V conditional form ＋ いいですか", "examples": ["本を 借りたいんですが、どう すれば いいですか。"], "popup_priority": "medium"}, {"id": "m2_L35_3", "source": "minna2", "lesson": "Lesson 35", "rule": "3. N なら、～", "meaning": "Used when giving information to someone about something they have just said.", "connection": "N ＋ なら、～", "examples": ["温泉に 行きたいんですが、どこが いいですか。……温泉なら、白馬が いいですよ。"], "popup_priority": "medium"}, {"id": "m2_L35_4", "source": "minna2", "lesson": "Lesson 35", "rule": "4. ～は ありませんか (negative question)", "meaning": "A more considerate way of asking something. It makes it easier for the listener to answer in the negative.", "connection": "N は ありませんか", "examples": ["2、3日 旅行を しようと 思って いるんですが、どこか いい 所は ありませんか。"], "popup_priority": "medium"}, {"id": "m2_L36_1", "source": "minna2", "lesson": "Lesson 36", "rule": "1. V1 dictionary form / V1 ない-form ない ように、V2", "meaning": "This usage indicates taking the action denoted by V2 in order to achieve the situation expressed by ～ように. The dictionary form of a non-volitional verb or a verb's negative form is used before ように.", "connection": "V1 dictionary form / V1 ない-form ない ＋ ように、V2", "examples": ["速く 泳げるように、毎日 練習して います。", "忘れないように、メモして ください。"], "popup_priority": "medium"}, {"id": "m2_L36_2", "source": "minna2", "lesson": "Lesson 36", "rule": "2. V dictionary form ように なります", "meaning": "なります indicates a change of state. When a potential verb, or verbs such as わかります and みえます are used, it indicates changing from a state of being unable to do something to a state of being able to do it.", "connection": "V dictionary form ＋ ように なります", "examples": ["毎日 練習すれば、泳げるように なります。", "やっと 自転車に 乗れるように なりました。", "ショパンの 曲が 弾けるように なりましたか。……いいえ、まだ 弾けません。", "日本人は 100年ぐらいまえから 牛肉や 豚肉を 食べるように なりました。"], "popup_priority": "medium"}, {"id": "m2_L36_3", "source": "minna2", "lesson": "Lesson 36", "rule": "3. V dictionary form / Vない-form ない ように します", "meaning": "This indicates that the speaker tries to perform a certain behaviour habitually. ～ように して ください is used to politely ask someone to try to acquire the habit of performing a certain behaviour.", "connection": "V dictionary form / Vない-form ない ＋ ように します / ように して ください", "examples": ["毎日 運動して、何でも 食べるように して います。", "歯に 悪いですから、甘い 物を 食べないように して います。", "もっと 野菜を 食べるように して ください。", "絶対に パスポートを なくさないように して ください。"], "popup_priority": "medium"}, {"id": "m2_L36_4", "source": "minna2", "lesson": "Lesson 36", "rule": "4. い-adj（～い）→～く / な-adj［な］→～に", "meaning": "When an adjective modifies another adjective or a verb, it is used in the ～く form if it is an い-adjective and the ～に form if it is a な-adjective.", "connection": "い-adj (drop い) ＋ く / な-adj (drop な) ＋ に", "examples": ["早く 上手に お茶が たてられるように なりたいです。"], "popup_priority": "medium"}, {"id": "m2_L37_1", "source": "minna2", "lesson": "Lesson 37", "rule": "1. Passive verbs", "meaning": "Passive verbs are conjugated as Group II verbs. They are used to express actions from the standpoint of the receiver rather than the doer.", "connection": "Group I: change い-column sound to あ-column + れます / Group II: + られます / Group III: こられます, されます", "examples": ["かきます → かかれます", "ほめます → ほめられます"], "popup_priority": "medium"}, {"id": "m2_L37_2", "source": "minna2", "lesson": "Lesson 37", "rule": "2. N1（person 1）は N2（person 2）に passive V", "meaning": "This sentence pattern expresses an action performed by person 2 in relation to person 1 from the standpoint of the person at whom the action is directed (person 1). The person taking the action is indicated by the particle に.", "connection": "N1(person) は N2(person) に ＋ passive V", "examples": ["わたしは 先生に 褒められました。", "わたしは 母に 買い物を 頼まれました。", "わたしは 犬に かまれました。"], "popup_priority": "medium"}, {"id": "m2_L37_3", "source": "minna2", "lesson": "Lesson 37", "rule": "3. N1（person 1）は N2（person 2）に N3を passive V", "meaning": "This expresses person 2 performing an action on a possession of, or other thing associated with, person 1. In most cases, person 1 regards that action as an inconvenience or annoyance.", "connection": "N1(person) は N2(person) に N3 を ＋ passive V", "examples": ["わたしは 弟に パソコンを 壊されました。", "わたしは 犬に 手を かまれました。"], "popup_priority": "medium"}, {"id": "m2_L37_4", "source": "minna2", "lesson": "Lesson 37", "rule": "4. N（tangible/intangible）が／は passive V", "meaning": "A passive verb can be used when it is not necessary to mention who is carrying out the action involved, and the subject or topic can be either tangible or intangible.", "connection": "N が / は ＋ passive V", "examples": ["大阪で 展覧会が 開かれました。", "電話は 19世紀に 発明されました。", "この 本は 世界中で 読まれて います。"], "popup_priority": "medium"}, {"id": "m2_L37_5", "source": "minna2", "lesson": "Lesson 37", "rule": "5. Nから／Nで つくります", "meaning": "から is used when saying what something is made from (chemical change), and で is used when saying what something is made of (physical material).", "connection": "N から / N で ＋ つくられます", "examples": ["ビールは 麦から 造られます。", "昔 日本の 家は 木で 造られました。"], "popup_priority": "medium"}, {"id": "m2_L37_6", "source": "minna2", "lesson": "Lesson 37", "rule": "6. N1の N2", "meaning": "Indicates that the material mentioned (N1) is used as the raw material for something (N2).", "connection": "N1 の N2", "examples": ["これが 原料の 麦です。"], "popup_priority": "medium"}, {"id": "m2_L37_7", "source": "minna2", "lesson": "Lesson 37", "rule": "7. この／その／あの N（position）", "meaning": "When a demonstrative is attached to a noun indicating position (such as うえ, した, なか, となり, ちかく), it indicates where the speaker or listener is in relation to what the positional noun indicates.", "connection": "この / その / あの ＋ N(position)", "examples": ["あの 中に 入れますか。"], "popup_priority": "medium"}, {"id": "m2_L38_1", "source": "minna2", "lesson": "Lesson 38", "rule": "1. の as a nominaliser", "meaning": "の has the function of nominalising various expressions. The verbs, adjectives and nouns to which の is attached take the plain form.", "connection": "Plain form ＋ の", "examples": [], "popup_priority": "medium"}, {"id": "m2_L38_2", "source": "minna2", "lesson": "Lesson 38", "rule": "2. V dictionary form のは adj です", "meaning": "V dictionary form の is presented as the topic by attaching は to it. Adjectives such as むずかしい, やさしい, おもしろい, たのしい and たいへん are often used in this sentence pattern.", "connection": "V dictionary form ＋ のは ＋ adj です", "examples": ["テニスを するのは おもしろいです。", "テニスを 見るのは おもしろいです。"], "popup_priority": "medium"}, {"id": "m2_L38_3", "source": "minna2", "lesson": "Lesson 38", "rule": "3. V dictionary form のが adj です", "meaning": "In these examples, 'V dictionary form の' is what is described by the adjective. Adjectives describing things like preferences, skills and abilities are often seen in this sentence pattern.", "connection": "V dictionary form ＋ のが ＋ adj です", "examples": ["わたしは 花を 育てるのが 好きです。", "東京の 人は 歩くのが 速いです。"], "popup_priority": "medium"}, {"id": "m2_L38_4", "source": "minna2", "lesson": "Lesson 38", "rule": "4. V dictionary form のを 忘れました", "meaning": "They introduce an action that was supposed to have been taken regarding the object, and state that it has been forgotten.", "connection": "V dictionary form ＋ のを 忘れました", "examples": ["牛乳を 買うのを 忘れました。", "車の 窓を 閉めるのを 忘れました。"], "popup_priority": "medium"}, {"id": "m2_L38_5", "source": "minna2", "lesson": "Lesson 38", "rule": "5. V dictionary form のを 知って いますか", "meaning": "It is used when asking whether someone knows something specific.", "connection": "V dictionary form ＋ のを 知って いますか", "examples": ["鈴木さんが 来月 結婚するのを 知って いますか。", "木村さんに 赤ちゃんが 生まれたのを 知って いますか。……いいえ、知りませんでした。", "ミラーさんの 住所を 知って いますか。……いいえ、知りません。"], "popup_priority": "medium"}, {"id": "m2_L38_6", "source": "minna2", "lesson": "Lesson 38", "rule": "6. Plain form のは N2です", "meaning": "This sentence pattern is a way of emphasising N2. The speaker stresses what he or she wants to ask about, or it is used to correct what someone has said.", "connection": "[V / い-adj / な-adj / N plain form] ＋ のは N2 です (* な-adj and N use ～な)", "examples": ["初めて 会ったのは いつですか。……3年まえです。", "バンコクで 生まれたんですか。……いいえ、生まれたのは チェンマイです。", "父が 生まれたのは 北海道の 小さな 村です。"], "popup_priority": "medium"}, {"id": "m2_L39_1", "source": "minna2", "lesson": "Lesson 39", "rule": "1. ～て（で）、～", "meaning": "Indicates a cause or reason for the result indicated in the second part. The second part can only be a non-volitional expression (emotions, potential, state), or an event in the past.", "connection": "Vて-form / Vない-formなくて / い-adj (～くて) / な-adj/N (で) ＋ 、～", "examples": ["ニュースを 聞いて、びっくりしました。", "家族に 会えなくて、寂しいです。", "土曜日は 都合が 悪くて、行けません。", "話が 複雑で、よく わかりませんでした。", "事故が あって、バスが 遅れて しまいました。", "地震で ビルが 倒れました。"], "popup_priority": "medium"}, {"id": "m2_L39_2", "source": "minna2", "lesson": "Lesson 39", "rule": "2. Plain form ので、～", "meaning": "Like から, ので also indicates a cause or reason. Since it inherently states a result derived from a cause objectively, it is suitable for softly expressing a reason or justification.", "connection": "[V / い-adj / な-adj / N plain form] ＋ ので、～ (* な-adj and N use ～な)", "examples": ["日本語が わからないので、英語で 話して いただけませんか。", "用事が あるので、お先に 失礼します。"], "popup_priority": "medium"}, {"id": "m2_L39_3", "source": "minna2", "lesson": "Lesson 39", "rule": "3. 途中で", "meaning": "Means 'during' or 'on the way to'. It is used in conjunction with the dictionary form of a verb or with N の.", "connection": "V dictionary form / N の ＋ 途中で", "examples": ["実は 来る 途中で 事故が あって、バスが 遅れて しまったんです。", "マラソンの 途中で 気分が 悪く なりました。"], "popup_priority": "medium"}, {"id": "m2_L40_1", "source": "minna2", "lesson": "Lesson 40", "rule": "1. Plain form か、～", "meaning": "This sentence pattern is used when using a question that includes an interrogative (what, when, who, etc.) as a component of another sentence.", "connection": "[V / い-adj / な-adj / N plain form] ＋ か、～ (* な-adj and N drop ～だ)", "examples": ["JL107便は 何時に 到着するか、調べて ください。", "結婚の お祝いは 何が いいか、話して います。", "わたしたちが 初めて 会ったのは いつか、覚えて いますか。"], "popup_priority": "medium"}, {"id": "m2_L40_2", "source": "minna2", "lesson": "Lesson 40", "rule": "2. Plain form か どうか、～", "meaning": "This sentence pattern is adopted when using a question that does not include an interrogative as a component of another sentence.", "connection": "[V / い-adj / な-adj / N plain form] ＋ か どうか、～ (* な-adj and N drop ～だ)", "examples": ["忘年会に 出席するか どうか、20日までに 返事を ください。", "その 話は ほんとうか どうか、わかりません。", "まちがいが ないか どうか、調べて ください。"], "popup_priority": "medium"}, {"id": "m2_L40_3", "source": "minna2", "lesson": "Lesson 40", "rule": "3. Vて-form みます", "meaning": "This sentence pattern is used to indicate trying out an action.", "connection": "Vて-form ＋ みます", "examples": ["もう 一度 考えて みます。", "この ズボンを はいて みても いいですか。", "北海道へ 行って みたいです。"], "popup_priority": "medium"}, {"id": "m2_L40_4", "source": "minna2", "lesson": "Lesson 40", "rule": "4. い-adj（～い）→～さ", "meaning": "An い-adjective can be converted to a noun by changing the ending い to さ.", "connection": "い-adj (drop い) ＋ さ", "examples": ["山の 高さは どうやって 測るか、知って いますか。", "新しい 橋の 長さは 3,911メートルです。"], "popup_priority": "medium"}, {"id": "m2_L40_5", "source": "minna2", "lesson": "Lesson 40", "rule": "5. ～でしょうか", "meaning": "Using ～でしょうか in an interrogative sentence is a way of asking a question without demanding a definite answer, so it enables the speaker to give a softer impression to the listener.", "connection": "～でしょうか", "examples": ["ハンスは 学校で どうでしょうか。"], "popup_priority": "medium"}, {"id": "m2_L41_1", "source": "minna2", "lesson": "Lesson 41", "rule": "1. N1(person) に N2 を いただきます", "meaning": "When the speaker receives something from someone of higher status, いただきます is used rather than もらいます.", "connection": "N1(person) に / から N2 を いただきます", "examples": ["わたしは 社長に お土産を いただきました。"], "popup_priority": "medium"}, {"id": "m2_L41_2", "source": "minna2", "lesson": "Lesson 41", "rule": "2. [わたしに] N を くださいます", "meaning": "When someone of higher status gives the speaker something, くださいます is used rather than くれます.", "connection": "[わたしに] N を くださいます", "examples": ["社長が わたしに お土産を くださいました。", "部長が 娘に お土産を くださいました。"], "popup_priority": "medium"}, {"id": "m2_L41_3", "source": "minna2", "lesson": "Lesson 41", "rule": "3. N1 に N2 を やります", "meaning": "When the recipient is someone of lower status, an animal, or a plant, やります is used. (Note: These days, many people prefer to use あげます when giving to a lower status person as it sounds more polite).", "connection": "N1 に N2 を やります", "examples": ["わたしは 息子に お菓子を やりました（あげました）。", "わたしは 犬に えさを やりました。"], "popup_priority": "medium"}, {"id": "m2_L41_4", "source": "minna2", "lesson": "Lesson 41", "rule": "4. Vて-form いただきます / くださいます / やります", "meaning": "These are used for expressing the giving and receiving of actions, mirroring the politeness levels of their noun equivalents.", "connection": "Vて-form ＋ いただきます / くださいます / やります", "examples": ["わたしは 課長に 手紙の まちがいを 直して いただきました。", "部長の 奥さんが ［わたしに］ お茶を 教えて くださいました。", "わたしは 息子に 紙飛行機を 作って やりました（あげました）。"], "popup_priority": "medium"}, {"id": "m2_L41_5", "source": "minna2", "lesson": "Lesson 41", "rule": "5. Vて-form くださいませんか", "meaning": "This way of making a request is politer than ～て ください but not as polite as ～て いただけませんか.", "connection": "Vて-form ＋ くださいませんか", "examples": ["コピー機の 使い方を 教えて くださいませんか。"], "popup_priority": "medium"}, {"id": "m2_L41_6", "source": "minna2", "lesson": "Lesson 41", "rule": "6. N に V", "meaning": "The particle に can be used to mean 'as a token of' or 'in memory of'.", "connection": "N に ＋ V", "examples": ["田中さんが 結婚祝いに この お皿を くださいました。", "北海道旅行の お土産に 人形を 買いました。"], "popup_priority": "medium"}, {"id": "m2_L42_1", "source": "minna2", "lesson": "Lesson 42", "rule": "1. V dictionary form / N の ために、～", "meaning": "Indicates a purpose. It translates to 'in order to V' or 'for the benefit of N'. It differs from ように in that a volitional verb is used before ために.", "connection": "V dictionary form / N の ＋ ために、～", "examples": ["自分の 店を 持つ ために、貯金して います。", "引っ越しの ために、車を 借ります。", "家族の ために、うちを 建てます。"], "popup_priority": "medium"}, {"id": "m2_L42_2", "source": "minna2", "lesson": "Lesson 42", "rule": "2. V dictionary form / N に ～", "meaning": "This sentence pattern is used together with phrases such as つかいます, いいです, 便利です, 役に 立ちます, and [時間が] かかります in order to indicate their application or purpose.", "connection": "V dictionary form の / N ＋ に ～", "examples": ["この はさみは 花を 切るのに 使います。", "この かばんは 大きくて、旅行に 便利です。", "電話番号を 調べるのに 時間が かかりました。"], "popup_priority": "medium"}, {"id": "m2_L42_3", "source": "minna2", "lesson": "Lesson 42", "rule": "3. Quantifier は／も", "meaning": "When は is attached to a quantifier, it indicates the speaker thinks the amount is a minimum. When も is attached, it indicates the speaker thinks the amount is large.", "connection": "Quantifier ＋ は / も", "examples": ["わたしは ［ボーナスの］ 半分は 貯金する つもりです。", "……えっ、半分も 貯金するんですか。"], "popup_priority": "medium"}, {"id": "m2_L42_4", "source": "minna2", "lesson": "Lesson 42", "rule": "4. ～に よって", "meaning": "When a verb expressing creation or discovery (かきます, はつめいします, はっけんします, etc.) is used in the passive, the agent is indicated by によって, not by に.", "connection": "N(person) に よって ＋ Passive verb of creation/discovery", "examples": ["チキンラーメンは 1958年に 安藤百福さんに よって 発明されました。"], "popup_priority": "medium"}, {"id": "m2_L43_1", "source": "minna2", "lesson": "Lesson 43", "rule": "1. V ます-form そうです", "meaning": "Expresses the speaker's belief that the movement or change indicated by the verb is likely to occur ('looks like it's going to ~'). It is often used with adverbs like 今にも, もうすぐ, or これから.", "connection": "V ます-form (drop ます) ＋ そうです", "examples": ["今にも 雨が 降りそうです。", "もうすぐ 桜が 咲きそうです。", "これから 寒く なりそうです。"], "popup_priority": "medium"}, {"id": "m2_L43_2", "source": "minna2", "lesson": "Lesson 43", "rule": "2. い-adj / な-adj そうです", "meaning": "Used when inferring the nature of something from its external appearance, without having actually confirmed that inference ('seems ~' or 'looks ~').", "connection": "い-adj (drop い) / な-adj (drop な) ＋ そうです", "examples": ["この 料理は 辛そうです。", "彼女は 頭が よさそうです。", "この 机は 丈夫そうです。"], "popup_priority": "medium"}, {"id": "m2_L43_3", "source": "minna2", "lesson": "Lesson 43", "rule": "3. Vて-form 来ます", "meaning": "Indicates that the speaker is going to go somewhere, perform an action, and come back ('I will go and...').", "connection": "Vて-form / N(place) へ 行って / 出かけて ＋ 来ます", "examples": ["ちょっと たばこを 買って 来ます。", "スーパーで 牛乳を 買って 来ます。", "郵便局へ 行って 来ます。", "ちょっと 出かけて 来ます。"], "popup_priority": "medium"}, {"id": "m2_L44_1", "source": "minna2", "lesson": "Lesson 44", "rule": "1. ～すぎます", "meaning": "Indicates that the extent of an action or state is excessive, and is therefore usually used when that action or state is undesirable ('too much' / 'too').", "connection": "V ます-form (drop ます) / い-adj (drop い) / な-adj (drop な) ＋ すぎます", "examples": ["ゆうべ お酒を 飲みすぎました。", "この セーターは 大きすぎます。", "最近の 車は 操作が 簡単すぎて、運転が おもしろくないです。"], "popup_priority": "medium"}, {"id": "m2_L44_2", "source": "minna2", "lesson": "Lesson 44", "rule": "2. V ます-form やすいです／にくいです", "meaning": "With a volitional verb, it means the action is easy/difficult to carry out. With a non-volitional verb, it means the action is likely/unlikely to occur.", "connection": "V ます-form (drop ます) ＋ やすいです / にくいです", "examples": ["この パソコンは 使いやすいです。", "東京は 住みにくいです。", "白い シャツは 汚れやすいです。", "この コップは 割れにくくて、安全ですよ。"], "popup_priority": "medium"}, {"id": "m2_L44_3", "source": "minna2", "lesson": "Lesson 44", "rule": "3. い-adj（～く）／な-adj（～に）／Nに します", "meaning": "Expresses a change in the subject of a sentence, meaning 'to make (something) [adjective/noun]'.", "connection": "N を ＋ い-adj (drop い) ＋ く / な-adj (drop な) ＋ に / N2 に ＋ します", "examples": ["音を 大きく します。", "部屋を きれいに します。", "塩の 量を 半分に します。"], "popup_priority": "medium"}, {"id": "m2_L44_4", "source": "minna2", "lesson": "Lesson 44", "rule": "4. Nに します", "meaning": "This sentence pattern indicates a choice or decision.", "connection": "N に します", "examples": ["部屋は シングルに しますか、ツインに しますか。", "会議は あしたに します。"], "popup_priority": "medium"}, {"id": "m2_L45_1", "source": "minna2", "lesson": "Lesson 45", "rule": "1. ～場合は、～", "meaning": "An expression used for postulating a situation ('in the event of' or 'in case of'). The following sentence indicates how to cope with the situation or its consequences.", "connection": "V dictionary form / Vない-form ない / Vた-form / い-adj / な-adj な / N の ＋ 場合は、～", "examples": ["会議に 間に 合わない 場合は、連絡して ください。", "時間に 遅れた 場合は、会場に 入れません。", "パソコンの 調子が 悪い 場合は、どう したら いいですか。", "領収書が 必要な 場合は、言って ください。", "火事や 地震の 場合は、エレベーターを 使わないで ください。"], "popup_priority": "medium"}, {"id": "m2_L45_2", "source": "minna2", "lesson": "Lesson 45", "rule": "2. Plain form のに、～", "meaning": "Used when what is stated in the second clause contradicts what would have been expected from the first clause ('even though' or 'despite'). It often conveys a feeling of surprise or dissatisfaction.", "connection": "[V / い-adj / な-adj / N plain form] ＋ のに、～ (* な-adj and N use ～な)", "examples": ["約束を したのに、彼女は 来ませんでした。", "きょうは 日曜日なのに、働かなければ なりません。"], "popup_priority": "medium"}, {"id": "m2_L46_1", "source": "minna2", "lesson": "Lesson 46", "rule": "1. V dictionary form / Vて-form いる / Vた-form ところです", "meaning": "Used when describing an aspect of an action or event. The dictionary form indicates an action is just about to begin. Vて-form いる indicates an action is in progress. Vた-form indicates an action has just been completed.", "connection": "V dictionary form / Vて-form いる / Vた-form ＋ ところです", "examples": ["昼ごはんは もう 食べましたか。……いいえ、これから 食べる ところです。", "会議は もう 始まりましたか。……いいえ、今から 始まる ところです。", "故障の 原因が わかりましたか。……いいえ、今 調べて いる ところです。", "渡辺さんは いますか。……あ、たった今 帰った ところです。", "たった今 バスが 出た ところです。"], "popup_priority": "medium"}, {"id": "m2_L46_2", "source": "minna2", "lesson": "Lesson 46", "rule": "2. Vた-form ばかりです", "meaning": "Expresses the speaker's sense that not much time has passed since an action has been performed or an event has occurred, regardless of how much actual time has elapsed.", "connection": "Vた-form ＋ ばかりです", "examples": ["さっき 昼ごはんを 食べた ばかりです。", "木村さんは 先月 この 会社に 入った ばかりです。"], "popup_priority": "medium"}, {"id": "m2_L46_3", "source": "minna2", "lesson": "Lesson 46", "rule": "3. Plain form はずです", "meaning": "Used when a speaker is decisively stating a conclusion ('is bound to' / 'must be') that he or she has reached based on particular grounds.", "connection": "[V / い-adj / な-adj / N plain form] ＋ はずです (* な-adj uses ～な, N uses ～の)", "examples": ["ミラーさんは きょう 来るでしょうか。……来る はずですよ。きのう 電話が ありましたから。"], "popup_priority": "medium"}, {"id": "m2_L47_1", "source": "minna2", "lesson": "Lesson 47", "rule": "1. Plain form そうです (Hearsay)", "meaning": "An expression for conveying information from another source without introducing one's own opinion ('They say that ~' or 'According to ~'). The source is often indicated by ～によると.", "connection": "[V / い-adj / な-adj / N plain form] ＋ そうです (* な-adj and N use ～だ)", "examples": ["天気予報に よると、あしたは 寒く なるそうです。", "クララさんは 子どもの とき、フランスに 住んで いたそうです。", "バリは とても きれいだそうです。"], "popup_priority": "medium"}, {"id": "m2_L47_2", "source": "minna2", "lesson": "Lesson 47", "rule": "2. Plain form ようです", "meaning": "An expression used to describe what the speaker has concluded from observing a situation ('It seems that ~'). It is sometimes used with the adverb どうも.", "connection": "[V / い-adj / な-adj / N plain form] ＋ ようです (* な-adj uses ～な, N uses ～の)", "examples": ["人が 大勢 集まって いますね。……事故のようですね。パトカーと 救急車が 来て いますよ。", "せきも 出るし、頭も 痛い。どうも かぜを ひいたようだ。"], "popup_priority": "medium"}, {"id": "m2_L47_3", "source": "minna2", "lesson": "Lesson 47", "rule": "3. 声／音／におい／味 が します", "meaning": "Describes a voice, other sound, smell, taste, or other sensation that the speaker has perceived using his or her sense organs.", "connection": "声 / 音 / におい / 味 ＋ が します", "examples": ["にぎやかな 声が しますね。"], "popup_priority": "medium"}, {"id": "m2_L48_1", "source": "minna2", "lesson": "Lesson 48", "rule": "1. Causative verbs", "meaning": "Causative verbs indicate compulsion ('make someone do') or permission ('let someone do'). They conjugate as Group II verbs.", "connection": "Group I: change い-column to あ-column + せる / Group II: + させる / Group III: こさせる, させる", "examples": ["かきます → かかせる", "たべます → たべさせる", "きます → こさせる", "します → させる"], "popup_priority": "medium"}, {"id": "m2_L48_2", "source": "minna2", "lesson": "Lesson 48", "rule": "2. Causative-verb sentences", "meaning": "When the base verb is intransitive, the person made/let to do the action is marked by を. When the base verb is transitive, the person made/let to do the action is marked by に, and the object is marked by を.", "connection": "N(person) を ＋ causative V(intransitive) / N(person) に N を ＋ causative V(transitive)", "examples": ["部長は ミラーさんを アメリカへ 出張させます。", "わたしは 娘を 自由に 遊ばせました。", "朝は 忙しいですから、娘に 朝ごはんの 準備を 手伝わせます。", "先生は 生徒に 自由に 意見を 言わせました。"], "popup_priority": "medium"}, {"id": "m2_L48_3", "source": "minna2", "lesson": "Lesson 48", "rule": "3. Causative verbて-form いただけませんか", "meaning": "Used when politely asking the listener to allow the speaker to do something ('Would you please let me do ~?').", "connection": "Causative verbて-form ＋ いただけませんか", "examples": ["友達の 結婚式が あるので、早く 帰らせて いただけませんか。"], "popup_priority": "medium"}, {"id": "m2_L49_1", "source": "minna2", "lesson": "Lesson 49", "rule": "1. Respectful verbs (Passive form)", "meaning": "These verbs take the same form as passive verbs but are used to show respect towards the person performing the action.", "connection": "Conjugated to passive form", "examples": ["中村さんは 7時に 来られます。", "お酒を やめられたんですか。"], "popup_priority": "medium"}, {"id": "m2_L49_2", "source": "minna2", "lesson": "Lesson 49", "rule": "2. お Vます-form に なります", "meaning": "This form is generally considered to be more polite than the respectful verbs using the passive form.", "connection": "お ＋ Vます-form (drop ます) ＋ に なります", "examples": ["社長は もう お帰りに なりました。"], "popup_priority": "medium"}, {"id": "m2_L49_3", "source": "minna2", "lesson": "Lesson 49", "rule": "3. Special respectful verbs", "meaning": "Several verbs have special respectful equivalents which show a high level of respect (e.g., いらっしゃいます, 召し上がります, おっしゃいます, なさいます, ご覧に なります, ご存じです).", "connection": "Special verb forms", "examples": ["ワット先生は 研究室に いらっしゃいます。", "どうぞ 召し上がって ください。"], "popup_priority": "medium"}, {"id": "m2_L49_4", "source": "minna2", "lesson": "Lesson 49", "rule": "4. お／ご ～ ください", "meaning": "This sentence pattern is the respectful equivalent of Vて-form ください. Verbs of Chinese origin (Group III) generally take ご instead of お.", "connection": "お ＋ Vます-form (drop ます) / ご ＋ N ＋ ください", "examples": ["どうぞ お入り ください。", "忘れ物に ご注意 ください。"], "popup_priority": "medium"}, {"id": "m2_L49_5", "source": "minna2", "lesson": "Lesson 49", "rule": "5. ～まして / ～ますので", "meaning": "When wishing to speak more politely, Vて-form may be changed to Vます-form まして, and the plain form ので may be changed to Vます-form ますので.", "connection": "Vます-form ＋ まして / ますので", "examples": ["ハンスが ゆうべ 熱を 出しまして、けさも まだ 下がらないんです。", "きょうは 学校を 休ませますので、先生によろしく お伝え ください。"], "popup_priority": "medium"}, {"id": "m2_L50_1", "source": "minna2", "lesson": "Lesson 50", "rule": "1. 謙譲語 I (Humble expressions I - お/ご～します)", "meaning": "Used to humbly refer to the actions of the speaker or their associates to show respect to the person towards whom the actions are directed.", "connection": "お ＋ Vます-form (drop ます) ＋ します / ご ＋ N ＋ します", "examples": ["重そうですね。お持ちしましょうか。", "私が 社長に スケジュールを お知らせします。", "兄が 車で お送りします。", "江戸東京博物館へ ご案内します。", "きょうの 予定を ご説明します。"], "popup_priority": "medium"}, {"id": "m2_L50_2", "source": "minna2", "lesson": "Lesson 50", "rule": "2. Special humble verbs (Humble I)", "meaning": "A number of verbs have special humble equivalents directed at the listener or a third party (e.g., 伺います, お目に かかります).", "connection": "Special verb forms", "examples": ["社長の 奥様に お目に かかりました。", "あしたは だれが 手伝いに 来て くれますか。…… 私が 伺います。"], "popup_priority": "medium"}, {"id": "m2_L50_3", "source": "minna2", "lesson": "Lesson 50", "rule": "3. 謙譲語 II (Humble expressions II - verbs)", "meaning": "Used to refer to the actions of the speaker or their associates in a way that shows politeness towards the listener, even if the action doesn't directly involve the listener. (e.g., 申します, 参ります, いたします, おります).", "connection": "Special verb forms", "examples": ["私は ミラーと 申します。", "アメリカから 参りました。"], "popup_priority": "medium"}, {"id": "m1_L1_1", "source": "minna1", "lesson": "Lesson 1", "rule": "1. N1 は N2 です", "meaning": "The particle は indicates that the noun before it (N1) is the topic of the sentence. Nouns used with です work as predicates. です indicates judgment or assertion, and shows politeness towards the listener.", "connection": "N1 は N2 です", "examples": ["わたしは マイク・ミラーです。", "わたしは 会社員です。"], "popup_priority": "low"}, {"id": "m1_L1_2", "source": "minna1", "lesson": "Lesson 1", "rule": "2. N1 は N2 じゃ（では） ありません", "meaning": "じゃ（では） ありません is the negative form of です. じゃ ありません is often used in everyday conversation, while では ありません is used in formal speech and writing.", "connection": "N1 は N2 じゃ（では） ありません", "examples": ["サントスさんは 学生じゃ ありません。"], "popup_priority": "low"}, {"id": "m1_L1_3", "source": "minna1", "lesson": "Lesson 1", "rule": "3. N1 は N2 ですか", "meaning": "The particle か is used to express uncertainty, doubt, etc. A question asking whether a statement is correct or not is formed by adding か. An interrogative replaces the part of the sentence that states what the speaker wants to ask about.", "connection": "N1 は N2 ですか", "examples": ["ミラーさんは アメリカ人ですか。……はい、アメリカ人です。", "ミラーさんは 先生ですか。……いいえ、先生じゃ ありません。", "あの方は どなたですか。……［あの方は］ ミラーさんです。"], "popup_priority": "low"}, {"id": "m1_L1_4", "source": "minna1", "lesson": "Lesson 1", "rule": "4. N も", "meaning": "「も」is used when the same thing applies as was stated previously.", "connection": "N も", "examples": ["ミラーさんは 会社員です。グプタさんも 会社員です。"], "popup_priority": "low"}, {"id": "m1_L1_5", "source": "minna1", "lesson": "Lesson 1", "rule": "5. N1 の N2", "meaning": "When a noun N1 modifies a following noun N2, の is used to connect the two nouns. N1 represents an organisation or some kind of group to which N2 belongs.", "connection": "N1 の N2", "examples": ["ミラーさんは IMCの 社員です。"], "popup_priority": "low"}, {"id": "m1_L1_6", "source": "minna1", "lesson": "Lesson 1", "rule": "6. ～さん", "meaning": "さん is added to the given name or family name of the listener or a third person to show the speaker's respect. ちゃん is added to small children's names instead.", "connection": "Name ＋ さん / ちゃん", "examples": ["あの方は ミラーさんです。", "鈴木：　ミラーさんは 学生ですか。\nミラー：　いいえ、会社員です。"], "popup_priority": "low"}, {"id": "m1_L2_1", "source": "minna1", "lesson": "Lesson 2", "rule": "1. これ／それ／あれ", "meaning": "Demonstratives that work as nouns. これ refers to something near the speaker, それ refers to something near the listener, and あれ refers to something distant from both.", "connection": "これ／それ／あれ", "examples": ["それは 辞書ですか。", "これは だれの 傘ですか。"], "popup_priority": "low"}, {"id": "m1_L2_2", "source": "minna1", "lesson": "Lesson 2", "rule": "2. この N／その N／あの N", "meaning": "この, その and あの modify nouns to specify which thing or person is being referred to.", "connection": "この／その／あの ＋ N", "examples": ["この 本は わたしのです。", "あの 方は どなたですか。"], "popup_priority": "low"}, {"id": "m1_L2_3", "source": "minna1", "lesson": "Lesson 2", "rule": "3. そうです", "meaning": "In a noun sentence, そう is often used to answer (in the affirmative) a question requiring an affirmative or negative answer. To answer negatively, 違います (No, it isn't) is typically used.", "connection": "N/A", "examples": ["それは 辞書ですか。……はい、そうです。", "それは ミラーさんのですか。……いいえ、違います。", "それは シャープペンシルですか。……いいえ、ボールペンです。"], "popup_priority": "low"}, {"id": "m1_L2_4", "source": "minna1", "lesson": "Lesson 2", "rule": "4. ～か、～か", "meaning": "A question asking the listener to choose between two or more alternatives for the answer.", "connection": "Sentence 1 か、Sentence 2 か", "examples": ["これは 「９」ですか、「７」ですか。……「９」です。"], "popup_priority": "low"}, {"id": "m1_L2_5", "source": "minna1", "lesson": "Lesson 2", "rule": "5. N1 の N2", "meaning": "The particle の is used to connect two nouns. N1 explains what N2 is about, or N1 indicates who owns N2.", "connection": "N1 の N2", "examples": ["これは コンピューターの 本です。", "これは わたしの 本です。"], "popup_priority": "low"}, {"id": "m1_L2_6", "source": "minna1", "lesson": "Lesson 2", "rule": "6. の substituting for a noun", "meaning": "の can be used instead of a noun that has already been mentioned. It is used as a replacement for things but not for people.", "connection": "N1 の", "examples": ["あれは だれの かばんですか。……佐藤さんのです。", "この かばんは あなたのですか。……いいえ、わたしのじゃ ありません。", "ミラーさんは IMCの 社員ですか。……はい、IMCの 社員です。"], "popup_priority": "low"}, {"id": "m1_L2_7", "source": "minna1", "lesson": "Lesson 2", "rule": "7. お～", "meaning": "The prefix お is attached to words when the speaker is speaking politely.", "connection": "お ＋ N", "examples": ["［お］みやげ", "［お］さけ"], "popup_priority": "low"}, {"id": "m1_L2_8", "source": "minna1", "lesson": "Lesson 2", "rule": "8. そうですか", "meaning": "Used by the speaker to acknowledge some new information he or she has just been given. It is pronounced with a falling intonation.", "connection": "そうですか", "examples": ["この 傘は あなたのですか。……いいえ、違います。シュミットさんのです。\nそうですか。"], "popup_priority": "low"}, {"id": "m1_L3_1", "source": "minna1", "lesson": "Lesson 3", "rule": "1. ここ／そこ／あそこ／こちら／そちら／あちら", "meaning": "Demonstratives referring to places based on distance from the speaker and listener. こちら, そちら, and あちら refer to direction and act as politer alternatives for places.", "connection": "ここ／そこ／あそこ／こちら／そちら／あちら", "examples": ["お手洗いは あそこです。", "エレベーターは あちらです。"], "popup_priority": "low"}, {"id": "m1_L3_2", "source": "minna1", "lesson": "Lesson 3", "rule": "2. N は place です", "meaning": "Used to state where a place, thing, or person is located.", "connection": "N は place です", "examples": ["お手洗いは あそこです。", "電話は 2階です。", "山田さんは 事務所です。"], "popup_priority": "low"}, {"id": "m1_L3_3", "source": "minna1", "lesson": "Lesson 3", "rule": "3. どこ／どちら", "meaning": "どこ is used for asking 'Where?' and どちら for 'Which direction?' (or as a politer 'Where?'). They are also used to ask the name of an organization (country, company, school) someone belongs to.", "connection": "N は どこ／どちら ですか", "examples": ["お手洗いは どこですか。……あそこです。", "エレベーターは どちらですか。……あちらです。", "学校は どこですか。", "会社は どちらですか。"], "popup_priority": "low"}, {"id": "m1_L3_4", "source": "minna1", "lesson": "Lesson 3", "rule": "4. N1 の N2", "meaning": "When N1 is the name of a country or company and N2 is the product, it indicates that the product N2 is made in that country or by that company.", "connection": "N1(country/company) の N2(product)", "examples": ["これは どこの コンピューターですか。……日本の コンピューターです。", "これは どこの コンピューターですか。……パワー電気の コンピューターです。"], "popup_priority": "low"}, {"id": "m1_L3_5", "source": "minna1", "lesson": "Lesson 3", "rule": "5. お～", "meaning": "The prefix お is added to things related to the listener or a third party in order to show the speaker's respect toward that person.", "connection": "お ＋ N", "examples": ["［お］国は どちらですか。"], "popup_priority": "low"}, {"id": "m1_L4_1", "source": "minna1", "lesson": "Lesson 4", "rule": "1. 今 －時 －分 です", "meaning": "To express time, the counter suffixes 時 (o'clock) and 分 (minutes) are placed after the numbers. To ask the time, なん is placed in front.", "connection": "今 ＋ Number時 ＋ Number分 ＋ です", "examples": ["今 何時ですか。……7時 10分です。"], "popup_priority": "low"}, {"id": "m1_L4_2", "source": "minna1", "lesson": "Lesson 4", "rule": "2. Vます／ Vません／ Vました／ Vませんでした", "meaning": "Vます works as a predicate and shows politeness. It expresses habitual truths or future events. The form inflects for negative and past tense.", "connection": "V ＋ ます/ません/ました/ませんでした", "examples": ["わたしは 毎日 勉強します。", "あした 6時に 起きます。", "きのう 勉強しましたか。……いいえ、勉強しませんでした。"], "popup_priority": "low"}, {"id": "m1_L4_3", "source": "minna1", "lesson": "Lesson 4", "rule": "3. N（time）に V", "meaning": "The particle に is appended to a noun indicating time to show the time of occurrence of an action.", "connection": "N (time) ＋ に ＋ V", "examples": ["6時半に 起きます。", "7月 2日に 日本へ 来ました。"], "popup_priority": "low"}, {"id": "m1_L4_4", "source": "minna1", "lesson": "Lesson 4", "rule": "4. N1 から N2 まで", "meaning": "から indicates a starting time or place, and まで indicates a finishing time or place.", "connection": "N1 から N2 まで", "examples": ["9時から 5時まで 勉強します。", "銀行は 9時から 3時までです。"], "popup_priority": "low"}, {"id": "m1_L4_5", "source": "minna1", "lesson": "Lesson 4", "rule": "5. N1 と N2", "meaning": "The particle と connects two nouns in coordinate relation (N1 and N2).", "connection": "N1 と N2", "examples": ["銀行の 休みは 土曜日と 日曜日です。"], "popup_priority": "low"}, {"id": "m1_L4_6", "source": "minna1", "lesson": "Lesson 4", "rule": "6. ～ね", "meaning": "The particle ね is attached to the end of a sentence to elicit agreement from the listener, check understanding, or emphasize something.", "connection": "Sentence ＋ ね", "examples": ["毎日 10時まで 勉強します。……大変ですね。", "山田さんの 電話番号は 871の 6813です。……871の 6813ですね。"], "popup_priority": "low"}, {"id": "m1_L5_1", "source": "minna1", "lesson": "Lesson 5", "rule": "1. N（place）へ 行きます／来ます／帰ります", "meaning": "When a verb indicates movement to a certain place, the particle へ (read as 'e') is put after the place noun to show the direction of the move.", "connection": "N (place) ＋ へ ＋ 行きます / 来ます / 帰ります", "examples": ["京都へ 行きます。", "日本へ 来ました。", "うちへ 帰ります。"], "popup_priority": "low"}, {"id": "m1_L5_2", "source": "minna1", "lesson": "Lesson 5", "rule": "2. どこ［へ］も 行きません／行きませんでした", "meaning": "When you want to deny everything covered by an interrogative, you attach the particle も to the interrogative and put the verb in its negative form.", "connection": "Interrogative ＋ も ＋ V(negative)", "examples": ["どこ［へ］も 行きません。", "だれも 来ませんでした。"], "popup_priority": "low"}, {"id": "m1_L5_3", "source": "minna1", "lesson": "Lesson 5", "rule": "3. N（vehicle）で 行きます／来ます／帰ります", "meaning": "The particle で indicates a means or method. It is attached to a vehicle to indicate the means of transport.", "connection": "N (vehicle) ＋ で ＋ V", "examples": ["電車で 行きます。", "タクシーで 来ました。", "駅から 歩いて 帰りました。 (Note: で is not used with あるいて)"], "popup_priority": "low"}, {"id": "m1_L5_4", "source": "minna1", "lesson": "Lesson 5", "rule": "4. N（person/animal）と V", "meaning": "When talking about doing something with a person or an animal, the person or animal is marked with the particle と.", "connection": "N (person/animal) ＋ と ＋ V", "examples": ["家族と 日本へ 来ました。", "一人で 東京へ 行きます。 (Note: と is not used with ひとりで)"], "popup_priority": "low"}, {"id": "m1_L5_5", "source": "minna1", "lesson": "Lesson 5", "rule": "5. いつ", "meaning": "The interrogative いつ (when) is used to ask when something will happen or happened. It does not take the particle に.", "connection": "いつ ＋ V", "examples": ["いつ 日本へ 来ましたか。……3月 25日に 来ました。", "いつ 広島へ 行きますか。……来週 行きます。"], "popup_priority": "low"}, {"id": "m1_L5_6", "source": "minna1", "lesson": "Lesson 5", "rule": "6. ～よ", "meaning": "The particle よ is placed at the end of a sentence to emphasise information which the listener does not know, or to show assertiveness.", "connection": "Sentence ＋ よ", "examples": ["この 電車は 甲子園へ 行きますか。……いいえ、行きません。次の 「普通」 ですよ。"], "popup_priority": "low"}, {"id": "m1_L6_1", "source": "minna1", "lesson": "Lesson 6", "rule": "1. Nを V（transitive）", "meaning": "The particle を is used to indicate the direct object of a transitive verb.", "connection": "Nを V（transitive）", "examples": ["ジュースを 飲みます。"], "popup_priority": "low"}, {"id": "m1_L6_2", "source": "minna1", "lesson": "Lesson 6", "rule": "2. Nを します", "meaning": "A fairly wide range of nouns are used as the objects of the verb します, which means that the action denoted by the noun is performed. It is used for playing sports/games, holding gatherings/events, or doing something.", "connection": "Nを します", "examples": ["サッカーを します", "パーティーを します", "宿題を します"], "popup_priority": "low"}, {"id": "m1_L6_3", "source": "minna1", "lesson": "Lesson 6", "rule": "3. 何を しますか", "meaning": "This is a question to ask about someone's actions.", "connection": "何を しますか", "examples": ["月曜日 何を しますか。…… 京都へ 行きます。", "きのう 何を しましたか。……サッカーを しました。"], "popup_priority": "low"}, {"id": "m1_L6_4", "source": "minna1", "lesson": "Lesson 6", "rule": "4. なん and なに", "meaning": "Both なん and なに mean 'what'. なん is used when it precedes a word whose first sound is in the た, だ or な-row, or when using it with a counter suffix. なに is used in all other cases.", "connection": "なん / なに", "examples": ["それは 何ですか。", "何の 本ですか。", "テレーザちゃんは 何歳ですか。", "何を 買いますか。"], "popup_priority": "low"}, {"id": "m1_L6_5", "source": "minna1", "lesson": "Lesson 6", "rule": "5. N（place）で V", "meaning": "When added after a noun denoting a place, the particle で indicates the occurrence of an action in that place.", "connection": "N（place）で V", "examples": ["駅で 新聞を 買います。"], "popup_priority": "low"}, {"id": "m1_L6_6", "source": "minna1", "lesson": "Lesson 6", "rule": "6. Vませんか", "meaning": "This expression is used when the speaker wants to invite someone to do something.", "connection": "Vませんか", "examples": ["いっしょに 京都へ 行きませんか。……ええ、いいですね。"], "popup_priority": "low"}, {"id": "m1_L6_7", "source": "minna1", "lesson": "Lesson 6", "rule": "7. Vましょう", "meaning": "This expression is used when a speaker is positively inviting the listener to do something with the speaker. It is also used when responding positively to an invitation.", "connection": "Vましょう", "examples": ["ちょっと 休みましょう。", "いっしょに 昼ごはんを 食べませんか。……ええ、食べましょう。"], "popup_priority": "low"}, {"id": "m1_L6_8", "source": "minna1", "lesson": "Lesson 6", "rule": "8. ～か", "meaning": "か indicates that the listener has received and accepted some new information. It is used in the same way as the か in そうですか.", "connection": "～か", "examples": ["日曜日 京都へ 行きました。…… 京都ですか。いいですね。"], "popup_priority": "low"}, {"id": "m1_L7_1", "source": "minna1", "lesson": "Lesson 7", "rule": "1. N（tool/means）で V", "meaning": "The particle で indicates a method or means used for an action.", "connection": "N（tool/means）で V", "examples": ["はしで 食べます。", "日本語で レポートを 書きます。"], "popup_priority": "low"}, {"id": "m1_L7_2", "source": "minna1", "lesson": "Lesson 7", "rule": "2. 'Word/Sentence'は ～語で 何ですか", "meaning": "This question is used to ask how to say a word or sentence in another language.", "connection": "'Word/Sentence'は ～語で 何ですか", "examples": ["「ありがとう」は 英語で 何ですか。……「Thank you」です。", "「Thank you」は 日本語で 何ですか。……「ありがとう」です。"], "popup_priority": "low"}, {"id": "m1_L7_3", "source": "minna1", "lesson": "Lesson 7", "rule": "3. N1（person）に N2を あげます, etc.", "meaning": "Verbs like あげます, かします and おしえます indicate imparting things or information, so they must be used with a noun saying to whom those things or information are imparted. The particle に is used to denote the recipient.", "connection": "N1（person）に N2を あげます / かします / おしえます", "examples": ["［わたしは］ 木村さんに 花を あげました。", "［わたしは］ イーさんに 本を 貸しました。", "［わたしは］ 山田さんに 英語を 教えます。"], "popup_priority": "low"}, {"id": "m1_L7_4", "source": "minna1", "lesson": "Lesson 7", "rule": "4. N1（person）に N2を もらいます, etc.", "meaning": "Verbs like もらいます, かります and ならいます indicate receiving things or information, so they are used with a noun indicating the person from whom those things or information are received. The particle に (or から) is used to denote that person.", "connection": "N1（person）に / から N2を もらいます / かります / ならいます", "examples": ["［わたしは］ 山田さんに 花を もらいました。", "［わたしは］ カリナさんに CDを 借りました。", "［わたしは］ ワンさんに 中国語を 習います。", "銀行から お金を 借りました。"], "popup_priority": "low"}, {"id": "m1_L7_5", "source": "minna1", "lesson": "Lesson 7", "rule": "5. もう Vました", "meaning": "もう means 'already' and is used with Vました. In this case, Vました means that the action has been completed.", "connection": "もう Vました", "examples": ["もう 荷物を 送りましたか。……はい、［もう］ 送りました。", "もう 荷物を 送りましたか。……いいえ、まだ 送って いません。", "もう 荷物を 送りましたか。……いいえ、まだです。"], "popup_priority": "low"}, {"id": "m1_L7_6", "source": "minna1", "lesson": "Lesson 7", "rule": "6. Omission of particles", "meaning": "Particles are often omitted in informal speech when the relationships between the parts of speech before and after them are obvious.", "connection": "N/A", "examples": ["この スプーン［は］、すてきですね。", "コーヒー［を］、もう 一杯 いかがですか。"], "popup_priority": "low"}, {"id": "m1_L8_1", "source": "minna1", "lesson": "Lesson 8", "rule": "1. Adjectives", "meaning": "Adjectives are used as predicates, and in sentences like Nは adj です they indicate the state of a noun or are used to modify a noun. They are divided into one of two groups, い-adjectives and な-adjectives, depending on how they inflect.", "connection": "い-adj / な-adj", "examples": [], "popup_priority": "low"}, {"id": "m1_L8_2", "source": "minna1", "lesson": "Lesson 8", "rule": "2. Nは な-adj［な／］です / Nは い-adj（～い）です", "meaning": "Adjective sentences that are non-past and affirmative end in です, which shows politeness toward the listener. Both types of adjective are attached to the front of です, but な-adjectives drop their な, while い-adjectives retain their い.", "connection": "Nは な-adj (drop な) です / Nは い-adj です", "examples": ["ワット先生は 親切です。", "富士山は 高いです。"], "popup_priority": "low"}, {"id": "m1_L8_3", "source": "minna1", "lesson": "Lesson 8", "rule": "3. な-adj［な／］じゃ（では） ありません / い-adj（～い）です → ～くないです", "meaning": "The non-past negative of a な-adj is formed by dropping the な and attaching じゃ（では） ありません to it. The non-past negative of an い-adjective is formed by dropping the final い and attaching くないです to it.", "connection": "な-adj じゃ ありません / い-adj (drop い) くないです", "examples": ["あそこは 静かじゃ（では） ありません。", "この 本は おもしろくないです。"], "popup_priority": "low"}, {"id": "m1_L8_4", "source": "minna1", "lesson": "Lesson 8", "rule": "4. な-adjな N / い-adj（～い） N", "meaning": "When an adjective is used to modify a noun, it is placed in front of the noun. な-adjectives keep their な in this case.", "connection": "な-adjな N / い-adj N", "examples": ["ワット先生は 親切な 先生です。", "富士山は 高い 山です。"], "popup_priority": "low"}, {"id": "m1_L8_5", "source": "minna1", "lesson": "Lesson 8", "rule": "5. ～が、～", "meaning": "が connects two statements in an antithetical relationship. When these are adjective clauses with the same subject, if the initial clause remarks on the subject positively, the subsequent clause will remark on it negatively, and vice versa.", "connection": "Sentence 1 が、Sentence 2", "examples": ["日本の 食べ物は おいしいですが、高いです。"], "popup_priority": "low"}, {"id": "m1_L8_6", "source": "minna1", "lesson": "Lesson 8", "rule": "6. とても／あまり", "meaning": "とても and あまり are both adverbs of degree, and both come before the adjectives they modify. とても is used in affirmative sentences ('very'). あまり, used with a negative, means 'not very'.", "connection": "とても + Affirmative / あまり + Negative", "examples": ["ペキンは とても 寒いです。", "これは とても 有名な 映画です。", "シャンハイは あまり 寒くないです。", "さくら大学は あまり 有名な 大学じゃ ありません。"], "popup_priority": "low"}, {"id": "m1_L8_7", "source": "minna1", "lesson": "Lesson 8", "rule": "7. Nは どうですか", "meaning": "The question Nは どうですか is used to inquire about the listener's impression, opinion or feelings about a thing, place, person, etc. that he or she has experienced, visited or met.", "connection": "Nは どうですか", "examples": ["日本の 生活は どうですか。……楽しいです。"], "popup_priority": "low"}, {"id": "m1_L8_8", "source": "minna1", "lesson": "Lesson 8", "rule": "8. N1は どんな N2ですか", "meaning": "どんな modifies a noun and is an interrogative used for inquiring about the state or nature of a person, thing, etc.", "connection": "N1は どんな N2ですか", "examples": ["奈良は どんな 町ですか。……古い 町です。"], "popup_priority": "low"}, {"id": "m1_L8_9", "source": "minna1", "lesson": "Lesson 8", "rule": "9. そうですね", "meaning": "Shows that the speaker is thinking. Used to express sympathy or agreement with something the speaker already thought or knew.", "connection": "そうですね", "examples": ["お仕事は どうですか。……そうですね。 忙しいですが、おもしろいです。"], "popup_priority": "low"}, {"id": "m1_L9_1", "source": "minna1", "lesson": "Lesson 9", "rule": "1. Nが あります／わかります / Nが 好きです／嫌いです／上手です／下手です", "meaning": "The objects of some verbs and adjectives are marked with が.", "connection": "Nが V / adj", "examples": ["わたしは イタリア 料理が 好きです。", "わたしは 日本語が わかります。", "わたしは 車が あります。"], "popup_priority": "low"}, {"id": "m1_L9_2", "source": "minna1", "lesson": "Lesson 9", "rule": "2. どんな N", "meaning": "A question sentence using どんな may be replied to by stating a specific name.", "connection": "どんな N", "examples": ["どんな スポーツが 好きですか。……サッカーが 好きです。"], "popup_priority": "low"}, {"id": "m1_L9_3", "source": "minna1", "lesson": "Lesson 9", "rule": "3. よく／だいたい／たくさん／少し／あまり／全然", "meaning": "These adverbs are placed before verbs (or adjectives) to modify them, indicating degree or quantity. あまり and 全然 are used with a negative.", "connection": "Adverb + V / adj", "examples": ["英語が よく わかります。", "英語が 少し わかります。", "英語が あまり わかりません。", "お金が たくさん あります。", "お金が 全然 ありません。", "ここは 少し 寒いです。", "あの 映画は 全然 おもしろくないです。"], "popup_priority": "low"}, {"id": "m1_L9_4", "source": "minna1", "lesson": "Lesson 9", "rule": "4. ～から、 ～", "meaning": "A statement before から gives the reason for a statement after it. It is also possible to state something and add the reason after it by adding ～から.", "connection": "Sentence 1 から、 Sentence 2", "examples": ["時間が ありませんから、新聞を 読みません。", "毎朝 新聞を 読みますか。……いいえ、読みません。時間が ありませんから。"], "popup_priority": "low"}, {"id": "m1_L9_5", "source": "minna1", "lesson": "Lesson 9", "rule": "5. どうして", "meaning": "The interrogative どうして is used to ask the reason for something. から is placed at the end of the reply giving the reason.", "connection": "どうして Vか / どうしてですか", "examples": ["どうして 朝 新聞を 読みませんか。……時間が ありませんから。", "きょうは 早く 帰ります。……どうしてですか。 子どもの 誕生日ですから。"], "popup_priority": "low"}, {"id": "m1_L10_1", "source": "minna1", "lesson": "Lesson 10", "rule": "1. Nが あります／います", "meaning": "あります and います indicate the existence of a thing, person, etc. The noun representing that thing or person is marked by が. あります is used for inanimate things (plants, objects), while います is used for animate things that can move by themselves (people, animals).", "connection": "Nが あります / います", "examples": ["コンピューターが あります。", "桜が あります。", "男の 人が います。", "犬が います。"], "popup_priority": "low"}, {"id": "m1_L10_2", "source": "minna1", "lesson": "Lesson 10", "rule": "2. Placeに Nが あります／います", "meaning": "This sentence form is used to say what or who is in a certain place. The particle に is used to mark the place.", "connection": "Placeに Nが あります / います", "examples": ["わたしの 部屋に 机が あります。", "事務所に ミラーさんが います。", "地下に 何が ありますか。……レストランが あります。", "受付に だれが いますか。……木村さんが います。"], "popup_priority": "low"}, {"id": "m1_L10_3", "source": "minna1", "lesson": "Lesson 10", "rule": "3. Nは placeに あります／います", "meaning": "This type of sentence takes the noun (the thing that exists) as its topic and talks about its existence. The noun is marked with は and must be something both the speaker and the listener are aware of.", "connection": "Nは placeに あります / います", "examples": ["東京ディズニーランドは 千葉県に あります。", "ミラーさんは 事務所に います。", "東京ディズニーランドは どこに ありますか。……千葉県に あります。"], "popup_priority": "low"}, {"id": "m1_L10_4", "source": "minna1", "lesson": "Lesson 10", "rule": "4. N1（thing/person/place）の N2（position）", "meaning": "When the noun N2 represents a direction or a position (うえ, した, まえ, うしろ, みぎ, ひだり, なか, そと, となり, ちかく, あいだ), it shows a positional relationship with N1.", "connection": "N1の N2（position）", "examples": ["机の 上に 写真が あります。", "郵便局は 銀行の 隣に あります。", "本屋は 花屋と スーパーの 間に あります。", "駅の 近くで 友達に 会いました。"], "popup_priority": "low"}, {"id": "m1_L10_5", "source": "minna1", "lesson": "Lesson 10", "rule": "5. N1や N2", "meaning": "The particle や is used when only a few (two or more) representative items are enumerated. など is sometimes put after the last noun to make it clear that the speaker has not mentioned all the nouns.", "connection": "N1や N2［など］", "examples": ["箱の 中に 手紙や 写真が あります。", "箱の 中に 手紙や 写真などが あります。"], "popup_priority": "low"}, {"id": "m1_L10_6", "source": "minna1", "lesson": "Lesson 10", "rule": "6. アジアストアですか", "meaning": "In actual conversation, people often do not reply immediately to a question they have been asked, but first confirm the main point of the question in this way.", "connection": "Nですか", "examples": ["すみません。アジアストアは どこですか。……アジアストアですか。あの ビルの 中です。"], "popup_priority": "low"}, {"id": "m1_L11_1", "source": "minna1", "lesson": "Lesson 11", "rule": "1. How to say numbers and use quantifiers", "meaning": "Words ひとつ, ふたつ... are used to count things up to 10. For 11 and above, the numbers themselves are used. When counting people and things, various counter suffixes are used depending on what is being counted (e.g., -人, -台, -枚, -回, -分, -時間, -日, -週間, -か月, -年).", "connection": "Number + counter suffix", "examples": ["りんごを 4つ 買いました。", "外国人の 学生が 2人 います。", "国で 2か月 日本語を 勉強しました。"], "popup_priority": "low"}, {"id": "m1_L11_2", "source": "minna1", "lesson": "Lesson 11", "rule": "2. Asking how many (いくつ, なん, どのくらい, ぐらい)", "meaning": "Quantifiers are usually placed directly after the noun + particle. いくつ asks how many items (up to 10). なん + counter suffix asks how many for specific items. どのくらい asks the length of time. ぐらい is added after quantifiers to mean 'about'.", "connection": "N + Particle + Quantifier / いくつ / なん＋counter suffix / どのくらい / ぐらい", "examples": ["みかんを いくつ 買いましたか。…… 8つ 買いました。", "この 会社に 外国人が 何人 いますか。……5人 います。", "毎晩 何時間 日本語を 勉強しますか。……2時間 勉強します。", "どのくらい 日本語を 勉強しましたか。……3年 勉強しました。", "大阪から 東京まで どのくらい かかりますか。……新幹線で 2時間半 かかります。", "学校に 先生が 30人ぐらい います。", "15分ぐらい かかります。"], "popup_priority": "low"}, {"id": "m1_L11_3", "source": "minna1", "lesson": "Lesson 11", "rule": "3. Quantifier (time period) に －回 V", "meaning": "This expression indicates the frequency of an action within a specific time period.", "connection": "Quantifier (time period) に －回 V", "examples": ["1か月に 2回 映画を 見ます。"], "popup_priority": "low"}, {"id": "m1_L11_4", "source": "minna1", "lesson": "Lesson 11", "rule": "4. Quantifierだけ／ Nだけ", "
